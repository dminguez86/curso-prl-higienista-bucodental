b:[["1. Riesgo eléctrico",FIGI("assets/l82-equipos.webp","Higienista retirando de uso un equipo con un cable dañado","Un equipo con una anomalía debe dejar de usarse hasta que se compruebe su seguridad.")+UL(["Revisa visualmente cables, enchufes y carcasas.","No uses equipos con partes expuestas, olor a quemado, chispas o humedad anormal.","No conectes ni desconectes con las manos mojadas ni sobrecargues regletas. Desenchufa por la clavija.","La reparación corresponde a personal cualificado y autorizado."])],
["2. Autoclave y superficies calientes",UL(["Respeta el ciclo, el enfriamiento, la despresurización y la apertura previstos por el fabricante.","<b>No fuerces puertas ni anules enclavamientos.</b>","Manipula las bandejas con los útiles y la protección térmica establecidos.","Evita situar cara y manos en la salida de vapor. Señaliza los equipos fuera de servicio."])],
["3. Aire comprimido, botellas y gases",UL(["No uses aire comprimido para limpiarte ni manipules tuberías a presión.","El mantenimiento del compresor y de los recipientes sigue su programa reglamentario.","Si hay oxígeno u otros gases: botellas fijadas y protegidas, reguladores compatibles y personal formado.","Mantén el oxígeno lejos de grasas, aceites, llamas y materiales combustibles."])+ALERT("<b>Parar, aislar y avisar.</b> Retira de uso el equipo inseguro, identifícalo y comunica el fallo. No improvises una reparación para mantener la agenda.")]],
key:"No uses equipos con cables dañados, chispas u olor a quemado; nada de manos mojadas ni regletas sobrecargadas, y las reparaciones, a personal autorizado. En el autoclave respeta enfriamiento y despresurización y no anules enclavamientos. Oxígeno lejos de grasas y llamas. Equipo inseguro: parar, aislar y avisar.",
q:[["Un equipo huele a quemado. ¿Qué haces?",["Lo retiras de uso, lo identificas y comunicas el fallo","Lo sigues usando hasta terminar la agenda","Lo reparas tú","Lo desenchufas tirando del cable y lo vuelves a usar"],0],
["El enclavamiento de la puerta del autoclave:",["No se fuerza ni se anula","Se puede anular para ganar tiempo","Se abre durante el ciclo","Solo es decorativo"],0],
["El oxígeno debe mantenerse lejos de:",["Grasas, aceites, llamas y materiales combustibles","El agua","Las ventanas","Los guantes de nitrilo"],0],
["Para limpiarte la ropa de polvo:",["No usas aire comprimido","Usas la jeringa de aire","Usas el compresor","Usas aire a presión sobre la piel"],0],
["¿Quién repara una avería eléctrica de un equipo?",["Personal cualificado y autorizado","Cualquier persona de la clínica","El paciente","Tú, si tienes prisa"],0]]}
]};
const M10={t:"Organización, salud y tu secuencia diaria de seguridad",fmin:3,s:"Riesgos de la organización del trabajo, estrés y violencia externa; salud, embarazo y especial sensibilidad; y la secuencia de seguridad de cada jornada.",L:[
{t:"Organización, estrés y violencia externa",ico:"🧠",min:7,src:"Ley 31/1995; INSST, factores psicosociales",
obj:["Identificar los riesgos derivados de la organización del trabajo.","Reconocer señales de alerta y comunicarlas.","Actuar ante agresiones o amenazas de pacientes."],
b:[["1. Riesgos de la organización",FIGI("assets/l91-organizacion.webp","Equipo de la clínica revisando la agenda de trabajo","La carga de trabajo y el trato recibido también influyen en la salud.")+UL(["Agenda sobrecargada, tiempos insuficientes, interrupciones, falta de autonomía, roles confusos y exposición al sufrimiento pueden generar tensión sostenida.","La clínica debe ajustar recursos y tiempos, clarificar funciones, permitir descansos y facilitar la coordinación.","La solución <b>no puede depender solo</b> de que cada persona soporte mejor la presión."])],
["2. Señales y comunicación",UL(["Fatiga persistente, irritabilidad, dificultad para dormir, errores repetidos o miedo a acudir al trabajo merecen atención.","Comunica las dificultades por la vía preventiva, solicita apoyo y participa en la evaluación de los factores psicosociales.","Respeta la desconexión digital y los tiempos de descanso."])+CASO("Prisa entre pacientes","El siguiente paciente espera y no hay tiempo suficiente para limpiar ni preparar la protección. ¿Se puede abreviar la secuencia?","No. Comunica la incidencia y reajusta la atención. Asegura limpieza, reprocesado y EPI antes de continuar: la agenda debe permitir una atención segura y, si no lo hace, debe revisarse.")],
["3. Agresiones o amenazas de pacientes",UL(["Mantén distancia y una vía de salida. Habla con calma, evita confrontaciones y pide apoyo.","No te quedes a solas ante una situación peligrosa.","Interrumpe la atención cuando sea necesario para la seguridad.","Ante amenaza inmediata, aléjate y avisa al <b>112</b>.","Registra el incidente y activa la asistencia y el seguimiento."])]],
key:"Agenda sobrecargada, interrupciones o roles confusos son riesgos de la organización: la clínica debe ajustar tiempos y recursos. Comunica las señales de alerta. Si no hay tiempo para limpiar y retirar EPI, se revisa la agenda. Ante una agresión: distancia, salida, apoyo y 112 si la amenaza es inmediata.",
q:[["Si el tiempo entre pacientes no permite limpiar ni retirar el EPI con seguridad:",["Se comunica y se revisa la agenda; no se abrevia la secuencia","Se abrevia la limpieza","Se reutiliza el EPI","Se omite la higiene de manos"],0],
["La solución al estrés laboral por sobrecarga:",["Requiere ajustar recursos, tiempos y funciones, no solo aguantar más","Depende solo de que cada persona lo soporte mejor","No existe","Es trabajar más horas"],0],
["Ante un paciente que se vuelve agresivo:",["Mantienes distancia y una vía de salida y pides apoyo","Te enfrentas a él","Te quedas a solas para calmarlo","Cierras la puerta del gabinete con él dentro"],0],
["Ante una amenaza inmediata:",["Te alejas y avisas al 112","Sigues con la atención","Esperas a que se calme solo","No haces nada"],0]]},
{t:"Salud, embarazo y especial sensibilidad",ico:"🤰",min:6,src:"Ley 31/1995, arts. 22, 25 y 26; RD 664/1997; RD 1029/2022",
obj:["Comunicar condiciones personales que puedan influir en el trabajo.","Conocer cómo se protege el embarazo y la lactancia.","Respetar las adaptaciones y revisarlas cuando cambien las circunstancias."],
b:[["1. Valorar de forma individual",FIGI("assets/l92-salud.webp","Consulta confidencial con el personal sanitario de vigilancia de la salud","Las medidas deben adaptarse cuando una condición personal pueda aumentar la vulnerabilidad frente a un riesgo.")+UL(["Comunica al personal sanitario de vigilancia de la salud las alergias, lesiones, limitaciones o situaciones que puedan influir en el trabajo.","La empresa debe conocer las conclusiones preventivas necesarias, manteniendo la <b>confidencialidad</b> de los datos clínicos.","No se comparten diagnósticos con compañeros."])],
["2. Embarazo y lactancia",UL(["Es recomendable comunicar la situación por el cauce establecido para que se valore la exposición real a agentes biológicos, químicos, radiaciones y exigencias físicas.","Primero se <b>adaptan</b> las condiciones o el tiempo de trabajo; si no es suficiente, se estudia un <b>puesto compatible</b> y, cuando proceda, las medidas de protección previstas legalmente (art. 26 LPRL)."])],
["3. Seguimiento y reincorporación",UL(["Revisa las medidas después de una baja, un accidente, cambios de tarea o nuevos síntomas, cuando sea necesario.","Respeta las restricciones y las adaptaciones indicadas.","No te asignes tareas que las contradigan ni retires protecciones por percibir una mejora transitoria."])+NOTE("<b>Aplicación práctica.</b> Una limitación cervical puede exigir ajustar el campo clínico, alternar tareas y revisar tiempos; no basta con recomendar estiramientos.")]],
key:"Comunica a vigilancia de la salud lo que pueda influir en tu trabajo: la empresa recibe conclusiones, no diagnósticos. En embarazo y lactancia primero se adaptan condiciones o tiempo, después se busca un puesto compatible. Respeta las adaptaciones y revísalas tras una baja o un cambio.",
q:[["¿A quién comunicas una alergia o limitación que influye en tu trabajo?",["Al personal sanitario de vigilancia de la salud","A todos los compañeros por el grupo de mensajería","A los pacientes","A nadie"],0],
["En embarazo o lactancia, la primera medida es:",["Adaptar las condiciones o el tiempo de trabajo","El despido","No hacer nada","Trabajar más horas para compensar"],0],
["Los diagnósticos de un trabajador:",["Son confidenciales y no se comparten con compañeros","Se publican en el tablón","Los conoce toda la plantilla","Se envían a los pacientes"],0],
["Tras una baja o un accidente, las medidas de adaptación:",["Se revisan cuando sea necesario","Nunca se revisan","Se eliminan automáticamente","Las decide cada trabajador por su cuenta"],0]]},
{t:"Tu secuencia diaria de seguridad",ico:"✅",min:6,src:"Lista de apoyo general; contrastar con los procedimientos de cada clínica",
obj:["Comprobar el gabinete antes de la primera atención.","Aplicar la secuencia segura entre pacientes.","Cerrar la jornada sin dejar riesgos pendientes."],
b:[["1. Antes de la primera atención",FIGI("assets/l93-secuencia.webp","Higienista revisando el gabinete antes de empezar la jornada","Utiliza esta lista como recordatorio operativo y contrástala con los procedimientos de tu clínica.")+FLOW(["1 Comprobar","2 Atender","3 Reprocesar","4 Registrar"])+UL(["Comprueba aspiración, equipos, ventilación, material reprocesado y EPI.","Ajusta sillón, taburete, luz y bandeja.","Confirma contenedor de punzantes disponible, vías de paso libres y conocimiento de la agenda y de las necesidades de asistencia."])],
["2. Entre pacientes",UL(["Retira de forma segura el material usado; separa residuos y transporta el instrumental en su recipiente.","Retira el EPI e higieniza las manos.","Limpia/desinfecta o cambia las barreras según el procedimiento.","Prepara material limpio, revisa el entorno y vuelve a colocarte la protección necesaria."])],
["3. Al cerrar",UL(["Deja los ciclos y equipos en la situación indicada; documenta controles y material pendiente.","No abandones un proceso que requiera vigilancia.","Cierra residuos, guarda productos, revisa el orden y comunica los fallos.","Retira la ropa de trabajo por el circuito previsto y realiza higiene de manos."])+NOTE("Lista de apoyo: no sustituye las comprobaciones específicas de cada equipo y tarea.")]],
key:"Antes de empezar: aspiración, equipos, ventilación, EPI, contenedor de punzantes y pasos libres. Entre pacientes: retirada segura, residuos, EPI fuera, manos, superficies y nueva protección. Al cerrar: ciclos documentados, residuos cerrados, fallos comunicados y ropa por su circuito.",
q:[["Antes de la primera atención debes comprobar, entre otras cosas:",["Aspiración, equipos, ventilación, EPI y contenedor de punzantes","Solo la agenda","Solo el móvil","Nada, se comprueba sobre la marcha"],0],
["Entre paciente y paciente:",["Retiras material y EPI, higienizas manos y limpias o cambias barreras","Solo cambias el babero","Mantienes los mismos guantes","No hace falta hacer nada"],0],
["Al cerrar la jornada, un ciclo de esterilización que requiere vigilancia:",["No se abandona: se deja en la situación indicada y se documenta","Se deja funcionando sin control","Se interrumpe abriendo la puerta","Se olvida hasta el día siguiente"],0],
["La ropa de trabajo al terminar:",["Se retira por el circuito previsto y se higienizan las manos","Se lleva puesta a casa","Se deja en la silla del gabinete","Se lava en el lavabo del gabinete"],0]]}
]};
const M11={t:"Emergencias y evacuación",fmin:3,s:"Cómo se organiza la respuesta a una emergencia en la clínica, qué hacer ante humo, fuego o una fuga, y cómo evacuar poniendo a las personas antes que el material.",L:[
{t:"Emergencias: organiza la respuesta",ico:"🧯",min:7,src:"Ley 31/1995, art. 20; RD 486/1997; RD 485/1997",
obj:["Localizar los medios de emergencia y conocer las funciones asignadas.","Actuar ante humo, fuego o una fuga.","Conocer los riesgos particulares del gabinete."],
b:[["1. Localiza y reconoce",FIGI("assets/l101-emergencias.webp","Higienista señalando la salida de emergencia, el extintor, el pulsador de alarma, el botiquín y el DEA","El plan del centro debe ser conocido antes de que ocurra el incidente.")+UL(["Salidas y recorridos, punto de reunión, alarma, extintores, botiquín, medios de aviso y <b>DEA</b> si existe.","Conoce quién coordina, quién avisa al 112 y quién ayuda a los pacientes con movilidad reducida.","Debe existir cobertura cuando falta la persona habitual."])],
["2. Ante humo, fuego o una fuga",UL(["Detén la actividad si es seguro y avisa de inmediato.","Prioriza sacar del peligro a las personas sin exponerte.","Solo intenta controlar un conato si estás formado, el medio es adecuado y mantienes una salida segura.","Si crece, hay humo o dudas, <b>abandona</b> y cierra puertas si puedes."])],
["3. Riesgos particulares del gabinete",UL(["Equipos eléctricos, productos inflamables y gases pueden agravar el incidente.","Corta suministros únicamente si estás autorizado y no te expones."])+ALERT("No uses agua sobre instalaciones energizadas. Un extintor no permite atravesar humo ni sustituye la evacuación.")+NOTE("<b>Ensayar para responder.</b> Practica el aviso, la evacuación y el reparto de funciones mediante simulacros, incluyendo pacientes tumbados o con necesidades de ayuda.")]],
key:"Conoce salidas, punto de reunión, alarma, extintores, botiquín y DEA, y quién coordina y quién llama al 112. Ante humo o fuego, avisa y pon a salvo a las personas; solo ataca un conato si estás formado y con salida segura. Nunca agua sobre equipos con tensión.",
q:[["¿Cuándo debes conocer el plan de emergencias de la clínica?",["Antes de que ocurra el incidente","Durante el incendio","Después del simulacro","No es necesario conocerlo"],0],
["Solo intentas apagar un conato si:",["Estás formado, el medio es adecuado y mantienes una salida segura","Hay mucho humo","No hay nadie más","Quieres salvar el material"],0],
["Sobre una instalación eléctrica con tensión:",["No se usa agua","Se usa agua abundante","Se usa un cubo de agua y jabón","Se usa la jeringa aire-agua"],0],
["Si el fuego crece o hay humo:",["Abandonas la zona y cierras puertas si puedes","Atraviesas el humo con el extintor","Esperas dentro del gabinete","Abres todas las ventanas y te quedas"],0]]},
{t:"Evacuación: personas antes que material",ico:"🚪",min:6,src:"Ley 31/1995, art. 20; plan de emergencias y evacuación del centro",
obj:["Dar la alarma y orientar a los pacientes.","Salir sin exponerse.","Realizar el recuento e informar a los servicios de emergencia."],
b:[["1. Dar la alarma y orientar",FIGI("assets/l102-evacuacion.webp","Higienista acompañando a un paciente hacia la salida de emergencia","Actúa con calma, pero sin demorar la salida para recoger pertenencias o terminar una tarea.")+FLOW(["1 Alarma","2 Salida segura","3 Reunión","4 Recuento"])+UL(["Sigue las instrucciones del responsable y las señales.","Indica al paciente que se levante solo si puede hacerlo con seguridad.","Acompaña a quien precise ayuda y utiliza los medios previstos. No improvises traslados manuales que puedan lesionarte o agravar su estado."])],
["2. Salir sin exponerse",UL(["Utiliza el recorrido seguro alternativo si el habitual está bloqueado.","<b>No uses ascensores</b> salvo que estén diseñados y previstos para evacuación.","No abras una puerta si percibes calor o humo peligroso tras ella. Evita entrar en zonas con humo.","Si no hay salida segura, refúgiate, cierra puertas y comunica tu ubicación al 112."])],
["3. Recuento y entrega de información",UL(["Acude al punto de reunión y comunica ausencias o personas que puedan haber quedado dentro.","<b>Nadie debe volver a buscarlas por su cuenta.</b>","Facilita a emergencias el acceso, la ubicación del incidente y la presencia de gases o sustancias relevantes.","Solo se vuelve al centro cuando se autorice."])]],
key:"Personas antes que material: sin recoger pertenencias ni terminar la tarea. Sigue al responsable y las señales, acompaña a quien lo necesite, nada de ascensores ni puertas calientes. En el punto de reunión comunica ausencias, nadie vuelve a entrar y solo se regresa con autorización.",
q:[["Durante una evacuación:",["No se usan los ascensores salvo que estén previstos para evacuación","Se usa el ascensor para ir más rápido","Se recogen las pertenencias primero","Se termina la atención en curso"],0],
["Si notas calor tras una puerta:",["No la abres y buscas otro recorrido","La abres rápidamente","La abres despacio y entras","La empujas con el hombro"],0],
["En el punto de reunión echas en falta a un compañero:",["Lo comunicas al responsable; nadie vuelve a buscarlo por su cuenta","Entras tú a buscarlo","No dices nada","Te vas a casa"],0],
["Si no hay salida segura:",["Te refugias, cierras puertas y comunicas tu ubicación al 112","Saltas por una ventana alta","Atraviesas el humo","Te escondes sin avisar"],0],
["¿Cuándo se vuelve a entrar en la clínica?",["Solo cuando se autorice","En cuanto deje de verse humo","Cuando quieras recoger tus cosas","A los cinco minutos"],0]]}
]};
const M12={t:"Primeros auxilios",fmin:4,s:"Proteger, avisar y socorrer; RCP y DEA en personas adultas; atragantamiento; atención inicial de heridas, quemaduras y salpicaduras; y urgencias durante la atención dental.",L:[
{t:"Primeros auxilios: proteger y avisar",ico:"📞",min:6,src:"ERC 2025, soporte vital básico y primeros auxilios; teléfono de emergencias 112",
obj:["Proteger antes de acercarse.","Avisar al 112 con la información necesaria.","Socorrer y vigilar según el estado de la persona."],
b:[["1. Proteger",FIGI("assets/l111-proteger.webp","Higienista comprobando si el paciente responde mientras una compañera llama al 112","Ayuda dentro de tu formación y activa pronto los recursos asistenciales.")+UL(["Comprueba que puedes acercarte sin exposición a electricidad, químicos, fuego o violencia.","Utiliza barreras frente a fluidos y retira el peligro solo si es seguro.","Detén la técnica dental. Retira instrumentos u objetos visibles de la boca únicamente si puedes hacerlo con seguridad, sin maniobras a ciegas."])],
["2. Avisar y valorar",UL(["Si la persona no responde, pide ayuda y llama al <b>112</b> inmediatamente, preferiblemente con manos libres o encargando la llamada a alguien.","Valora si respira con normalidad sin retrasar la RCP.","Indica dirección exacta, acceso, qué ocurre, número de afectados y estado.","Sigue las instrucciones y envía a alguien a recibir a la ayuda."])],
["3. Socorrer y vigilar",UL(["Si no responde y <b>no respira normalmente</b>, inicia RCP y pide el DEA. Los jadeos agónicos no son respiración normal.","Si no responde pero <b>respira normalmente</b>, mantén la vía aérea, usa la posición lateral cuando sea apropiada y no exista una contraindicación traumática, y vigila continuamente.","Si cambia la respiración, reevalúa e inicia RCP cuando proceda."])+ALERT("No dejes sola a la persona. No ofrezcas alimentos, bebidas ni medicación oral a quien esté inconsciente o no pueda tragar.")]],
key:"Protege antes de acercarte y detén la técnica. Si no responde, pide ayuda y llama al 112 (manos libres o delegando). No responde y no respira con normalidad: RCP y DEA; los jadeos no son respiración normal. Si respira, vía aérea, posición lateral y vigilancia continua.",
q:[["Una persona no responde y solo hace jadeos ocasionales:",["Inicias RCP y pides el DEA: los jadeos no son respiración normal","La colocas en posición lateral y esperas","Le das agua","Esperas a que se recupere sola"],0],
["Al llamar al 112 debes indicar:",["Dirección exacta, acceso, qué ocurre, número de afectados y estado","Solo tu nombre","Solo que es urgente y colgar","El nombre de la clínica sin dirección"],0],
["Una persona no responde pero respira normalmente y no hay sospecha de traumatismo:",["Posición lateral y vigilancia continua","Compresiones torácicas","Darle de beber","Dejarla sola mientras buscas ayuda sin avisar"],0],
["Antes de acercarte a socorrer:",["Compruebas que no hay riesgo eléctrico, químico, de fuego o violencia","Corres sin mirar","Retiras a ciegas objetos de la boca","Esperas a que llegue la ambulancia"],0]]},
{t:"RCP y DEA en personas adultas",ico:"❤️",min:8,src:"ERC 2025, soporte vital básico del adulto",
obj:["Reconocer la parada cardiorrespiratoria.","Realizar compresiones torácicas de calidad.","Utilizar el DEA en cuanto llegue."],
b:[["1. Compresiones de calidad",FIGI("assets/l112-rcp.webp","Compresiones torácicas mientras se colocan los parches del DEA","Persona que no responde y no respira normalmente: activa el 112 e inicia la ayuda sin demora.")+T(["Parámetro","Valor"],[["Frecuencia","100-120 compresiones por minuto"],["Profundidad","5-6 cm"],["Relación (si ventilas)","30 compresiones : 2 ventilaciones"]])+UL(["Coloca a la persona boca arriba sobre una superficie firme tan pronto como sea viable, sin retrasos importantes.","Arrodíllate a su lado y sitúa el talón de una mano en el <b>centro del pecho</b>, sobre la mitad inferior del esternón; la otra, encima.","Brazos rectos. Permite que el tórax se recupere y reduce las interrupciones."])],
["2. Ventilaciones y continuidad",UL(["Si estás formado y puedes realizarlas, alterna 30 compresiones y 2 ventilaciones de alrededor de 1 segundo, suficientes para elevar el pecho.","Si no puedes, realiza <b>compresiones continuas</b> siguiendo las indicaciones del 112.","Continúa hasta que se haga cargo la ayuda, reaparezcan signos claros de vida con respiración normal o no puedas continuar."])],
["3. Utiliza el DEA en cuanto llegue",UL(["Enciéndelo, descubre el pecho, coloca los parches según su dibujo y sigue las instrucciones.","<b>Nadie debe tocar a la persona</b> durante el análisis o la descarga.","Reanuda las compresiones inmediatamente cuando lo indique.","No interrumpas para comprobar el pulso si no estás entrenado."])+NOTE("La RCP requiere práctica supervisada con maniquí. La reanimación pediátrica necesita formación específica.")]],
key:"Compresiones en el centro del pecho, brazos rectos, 100-120 por minuto y 5-6 cm de profundidad, dejando que el tórax se recupere. Si estás formado, 30:2; si no, compresiones continuas. El DEA, en cuanto llegue: enciéndelo, parches según el dibujo y nadie toca a la persona durante el análisis o la descarga.",
q:[["¿A qué frecuencia se realizan las compresiones torácicas en un adulto?",["100-120 por minuto","40-60 por minuto","200 por minuto","Una cada 10 segundos"],0],
["¿Qué profundidad deben tener las compresiones en un adulto?",["5-6 cm","1-2 cm","10-12 cm","La que se pueda sin mover el pecho"],0],
["Si estás formado y realizas ventilaciones, la relación es:",["30 compresiones y 2 ventilaciones","15 compresiones y 1 ventilación","5 compresiones y 5 ventilaciones","Solo ventilaciones"],0],
["Durante el análisis o la descarga del DEA:",["Nadie debe tocar a la persona","Se siguen haciendo compresiones","Se sujeta la mano de la persona","Se le da agua"],0],
["Las manos se colocan:",["En el centro del pecho, sobre la mitad inferior del esternón","Sobre el abdomen","Sobre el cuello","En el lado izquierdo de las costillas"],0]]},
{t:"Atragantamiento en una persona adulta",ico:"🫁",min:6,src:"ERC 2025, primeros auxilios",
obj:["Distinguir la tos eficaz de la ineficaz.","Aplicar golpes interescapulares y compresiones abdominales.","Actuar si la persona pierde la respuesta."],
b:[["1. Si la tos es eficaz",FIGI("assets/l113-atragantamiento.webp","Golpes en la espalda y compresiones abdominales ante un atragantamiento","La obstrucción grave puede impedir hablar, respirar o toser eficazmente.")+FLOW(["1 Si la tos falla","2 Hasta 5 golpes","3 Hasta 5 compresiones","4 RCP si no responde"])+UL(["Anima a toser y observa. No golpees la espalda ni ofrezcas agua mientras la persona tose de forma eficaz.","Retira únicamente un objeto claramente visible y accesible sin empujarlo al interior.","En la clínica, la extracción instrumental requiere personal formado y condiciones seguras."])],
["2. Si la tos es ineficaz y sigue consciente",UL(["Pide ayuda y que llamen al 112.","Inclina a la persona hacia delante y da <b>hasta 5 golpes</b> entre las escápulas, comprobando tras cada uno.","Si no se resuelve, aplica <b>hasta 5 compresiones abdominales</b>. Alterna series hasta la expulsión o la pérdida de respuesta.","En embarazo o cuando no puedas rodear el abdomen, utiliza compresiones torácicas según tu formación."])],
["3. Si pierde la respuesta",UL(["Ayuda a descender de forma segura e inicia RCP. Confirma que se ha llamado al 112 y pide el DEA.","Al abrir la vía aérea, retira solo objetos visibles: <b>no hagas barridos digitales a ciegas</b>.","Tras compresiones abdominales o torácicas, la persona precisa valoración sanitaria aunque se recupere."])+NOTE("Secuencia para adultos. No se aplican compresiones abdominales a lactantes.")]],
key:"Si tose con eficacia, anímale a toser y no golpees. Si la tos es ineficaz: 112, hasta 5 golpes entre las escápulas y hasta 5 compresiones abdominales, alternando (torácicas si hay embarazo). Si pierde la respuesta: RCP y DEA, sin barridos a ciegas. Después, siempre valoración sanitaria.",
q:[["Una persona atragantada tose con fuerza de forma eficaz:",["La animas a toser y la observas","Le das golpes en la espalda","Le das agua","Le haces compresiones abdominales"],0],
["Si la tos es ineficaz y la persona está consciente, lo primero es:",["Pedir ayuda y dar hasta 5 golpes entre las escápulas","Hacer barridos con el dedo a ciegas","Darle agua","Tumbarla boca arriba"],0],
["En una mujer embarazada atragantada, en lugar de compresiones abdominales:",["Se usan compresiones torácicas según la formación","Se dan más golpes en el abdomen","No se hace nada","Se le da agua"],0],
["Si la persona atragantada pierde la respuesta:",["Inicias RCP y confirmas el aviso al 112 y el DEA","Sigues con golpes en la espalda de pie","Le das de beber","Esperas a que despierte"],0],
["Tras resolver un atragantamiento con compresiones abdominales:",["La persona precisa valoración sanitaria aunque se recupere","No hace falta nada más","Puede seguir comiendo","Puede conducir de inmediato"],0]]},
{t:"Lesiones: atención inicial segura",ico:"🩹",min:6,src:"ERC 2025, primeros auxilios; fichas de datos de seguridad",
obj:["Controlar un sangrado y atender traumatismos sin agravarlos.","Enfriar correctamente una quemadura térmica.","Actuar ante salpicaduras químicas y en los ojos."],
b:[["1. Heridas, sangrado y traumatismos",FIGI("assets/l114-lesiones.webp","Presión directa sobre una herida, enfriamiento de una quemadura y lavado ocular","Protege a la persona y evita maniobras que empeoren la lesión.")+UL(["Usa guantes y aplica <b>presión directa firme</b> con material limpio sobre el sangrado. Si es importante o no cede, llama al 112.","No retires objetos clavados.","No movilices una lesión grave salvo peligro inmediato; sujeta de forma cómoda y solicita asistencia.","Una lesión con material biológico activa además el protocolo específico."])],
["2. Quemaduras térmicas",UL(["Aparta del calor sin riesgo.","Enfría con <b>agua corriente fresca durante unos 20 minutos</b>, evitando enfriar en exceso al resto de la persona.","Retira anillos u objetos ajustados si no están adheridos. Cubre sin comprimir.","No uses hielo ni pomadas ni revientes ampollas. Solicita ayuda según extensión, profundidad y localización."])],
["3. Salpicaduras químicas y ojos",UL(["Inicia un lavado abundante inmediato y consulta la FDS.","En los ojos, irriga de forma continua y retira las lentillas si salen con facilidad. Solicita valoración urgente.","Retira la ropa contaminada con seguridad. Si hay polvo seco, elimínalo con cuidado antes del agua según la FDS.","No neutralices con otro químico ni frotes el ojo.","En un accidente eléctrico, no toques a la persona hasta eliminar el riesgo."])+ALERT("<b>Señales de alarma — 112:</b> dificultad respiratoria, pérdida de respuesta, sangrado intenso, exposición eléctrica importante o lesiones graves.")]],
key:"Sangrado: guantes y presión directa firme; no retires objetos clavados. Quemadura: agua corriente fresca unos 20 minutos, sin hielo, pomadas ni reventar ampollas. Químicos y ojos: lavado abundante e inmediato, FDS, sin neutralizar ni frotar. Ante señales de alarma, 112.",
q:[["Ante una herida que sangra:",["Aplicas presión directa firme con material limpio y guantes","Aplicas un torniquete siempre","Lavas con lejía","Retiras el objeto clavado"],0],
["Una quemadura térmica se enfría con:",["Agua corriente fresca durante unos 20 minutos","Hielo directamente","Pomada y vendaje apretado","Aceite"],0],
["Ante una salpicadura química en el ojo:",["Irrigas de forma continua y solicitas valoración urgente","Frotas el ojo","Aplicas otro químico para neutralizar","Esperas a ver si molesta"],0],
["Ante un objeto clavado en una herida:",["No lo retiras y solicitas asistencia","Lo sacas rápidamente","Lo giras para ver la profundidad","Lo empujas hacia dentro"],0],
["Las ampollas de una quemadura:",["No se revientan","Se revientan con una aguja","Se recortan","Se frotan con alcohol"],0]]},
{t:"Urgencias durante la atención dental",ico:"🦷",min:7,src:"ERC 2025, primeros auxilios; RD 1594/1994",
obj:["Actuar ante mareo, síncope o dolor torácico en el sillón.","Reconocer una hipoglucemia y actuar ante una convulsión.","Reconocer la anafilaxia y conocer los límites de tu actuación."],
b:[["1. Mareo, síncope y dolor torácico",FIGI("assets/l115-urgencias.webp","Paciente mareado en el sillón dental atendido por la higienista mientras llega el facultativo con el material de urgencias","Suspende la técnica, avisa al facultativo y aplica la valoración inicial. Si hay gravedad o dudas, activa el 112.")+UL(["Ante un mareo, evita la caída y coloca a la persona en posición cómoda, habitualmente tumbada si se tolera; controla la respuesta y la respiración.","No la incorpores de golpe tras la recuperación.","Ante dolor torácico sugestivo, dificultad respiratoria o empeoramiento: facilita reposo, avisa al 112 y prepara el DEA. No permitas que la persona conduzca."])],
["2. Hipoglucemia y convulsión",UL(["Si se sospecha <b>hipoglucemia</b> y la persona está consciente y traga con seguridad, ofrece glucosa o azúcar de absorción rápida conforme al protocolo. Si no puede tragar, nada por boca y 112.","En una <b>convulsión</b>, retira objetos peligrosos, protege la cabeza y mide el tiempo.","No inmovilices ni introduzcas nada en la boca.","Llama al 112 si dura más de 5 minutos, se repite sin recuperación, hay lesión o es la primera conocida."])],
