<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curso PRL · Higienista bucodental</title>
<meta name="description" content="Formación PRL (art. 19 Ley 31/1995) para higienistas bucodentales: riesgos del puesto, medidas preventivas, emergencias y acoso.">
<style>
html{--bg:#eef5f9;--card:#fff;--txt:#1d2b36;--mut:#4a5a68;--pri:#0277ab;--pri2:#009CD7;--acc:#128a3c;--acc2:#16B14C;--bd:#d6e4ec;--ok:#15803d;--ko:#c62828;--amb:#a15c00;--navy:#06476b;--navy2:#0277ab;--btnTxt:#fff;--tagTxt:#035f8c}
html[data-theme=dark]{--bg:#06131c;--card:#0d2130;--txt:#e8f0f6;--mut:#a9bccb;--pri:#4cc0f0;--pri2:#38b6ec;--acc:#3ddc84;--acc2:#3ddc84;--bd:#24445a;--ok:#22c55e;--ko:#ff6b6b;--amb:#fbbf24;--navy:#041e2e;--navy2:#06476b;--btnTxt:#04121d;--tagTxt:#9fdcf7}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;transition:background .3s,color .3s;overflow-x:hidden;
background-image:radial-gradient(1100px 600px at 100% -10%,color-mix(in srgb,var(--pri2) 12%,transparent),transparent 60%),linear-gradient(color-mix(in srgb,var(--pri) 5%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--pri) 5%,transparent) 1px,transparent 1px);background-size:auto,32px 32px,32px 32px;background-attachment:fixed}
a{color:var(--pri)}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;border-bottom:3px solid var(--acc2);box-shadow:0 4px 18px #0003}
header h1{font-size:1rem;margin:0;flex:1;display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap;overflow:hidden}
header h1 span{overflow:hidden;text-overflow:ellipsis}
header button{background:#ffffff1a;border:1px solid #ffffff40;color:#fff}
.logo-h{height:34px;background:#fff;border-radius:8px;padding:3px 8px;display:block;flex:none}
.prog{flex:2;max-width:320px;height:8px;background:#ffffff30;border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#009CD7,#16B14C);transition:width .5s}
#pct{font-size:.85rem}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--txt);border-radius:9999px;padding:7px 14px;transition:transform .15s,background .2s}button:hover{transform:translateY(-1px)}
.btn{background:var(--pri);color:var(--btnTxt);border:none;font-weight:700;box-shadow:0 4px 12px color-mix(in srgb,var(--pri) 30%,transparent)}
.wrap{display:flex;max-width:1240px;margin:auto}
nav{width:290px;flex:none;padding:16px;position:sticky;top:59px;height:calc(100vh - 59px);overflow:auto;background:color-mix(in srgb,var(--card) 70%,transparent)}
nav a{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;color:var(--txt);text-decoration:none;margin-bottom:2px;cursor:pointer;font-size:.88rem}
nav a:hover{background:color-mix(in srgb,var(--pri) 10%,transparent)}
nav a.on{background:linear-gradient(90deg,var(--pri),var(--pri2));color:var(--btnTxt)}nav a .ck{margin-left:auto}
nav details.ng{background:none;border:none;margin:6px 0}nav details.ng summary{padding:8px 10px;font-size:.92rem}nav details.ng summary small{color:var(--mut);font-weight:400}
main{flex:1;padding:22px;min-width:0}
.view{animation:fade .45s ease}@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1,h2,h3,h4{letter-spacing:-.01em;line-height:1.25}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 1px 2px #0000000d,0 8px 24px #0a1f330d}
.lc{cursor:pointer;transition:transform .2s,box-shadow .2s}.lc:hover{transform:translateY(-4px);box-shadow:0 10px 24px #00000022}
.tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.03em;border-radius:99px;padding:2px 10px;background:color-mix(in srgb,var(--pri2) 14%,var(--card));color:var(--tagTxt);border:1px solid color-mix(in srgb,var(--pri2) 35%,transparent)}
.tag.t2{background:color-mix(in srgb,var(--acc) 14%,var(--card));color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
details.bl{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:10px 0;overflow:hidden}
details.bl summary{padding:14px 16px;font-weight:700;cursor:pointer;list-style:none}details.bl summary::-webkit-details-marker{display:none}
details.bl summary::after{content:"＋";float:right;color:var(--pri)}details.bl[open] summary::after{content:"－"}
details.bl>div{padding:0 16px 14px}
.key{border-left:5px solid var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.note{border-left:5px solid var(--pri2);background:color-mix(in srgb,var(--pri2) 9%,var(--card));padding:12px 14px;border-radius:10px;margin:10px 0}
.alert{border-left:5px solid var(--ko);background:color-mix(in srgb,var(--ko) 9%,var(--card));padding:12px 14px;border-radius:10px;margin:10px 0}
.caso{border:2px dashed color-mix(in srgb,var(--pri) 55%,transparent);background:color-mix(in srgb,var(--pri) 6%,var(--card));padding:12px 14px;border-radius:12px;margin:12px 0}
.caso>b:first-child{color:var(--pri)}
.tbl{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}table{border-collapse:collapse;width:100%;min-width:480px;font-size:.92rem}th,td{border:1px solid var(--bd);padding:8px 10px;text-align:left;vertical-align:top}th{background:color-mix(in srgb,var(--pri) 15%,var(--card))}
.sem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}.sem>div{border-radius:12px;padding:12px;border:2px solid}
.sv{border-color:#16B14C!important;background:color-mix(in srgb,#16B14C 10%,var(--card))}.sa{border-color:#f59e0b!important;background:color-mix(in srgb,#f59e0b 12%,var(--card))}.sr{border-color:#e53935!important;background:color-mix(in srgb,#e53935 10%,var(--card))}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}.flow span{background:color-mix(in srgb,var(--pri) 12%,var(--card));border:1px solid color-mix(in srgb,var(--pri) 40%,transparent);border-radius:10px;padding:6px 10px;font-size:.88rem}.flow i{font-style:normal;color:var(--pri);font-weight:800}
.q{margin:16px 0}.q p{font-weight:700;margin:.2em 0 .5em}.opt{display:block;width:100%;text-align:left;margin:6px 0;border-radius:12px}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.ko{background:var(--ko);color:#fff;border-color:var(--ko)}.opt:disabled{cursor:default;transform:none;opacity:1}
html[data-theme=dark] .opt.ok,html[data-theme=dark] .opt.ko{color:#04121d}
.fb{font-size:.9rem;min-height:1.2em;font-weight:600}.score{font-size:1.15rem;font-weight:800}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
figure{margin:12px 0;text-align:center}figure img{max-width:100%;border-radius:12px;border:1px solid var(--bd);cursor:zoom-in;background:#fff}figcaption{font-size:.8rem;color:var(--mut)}
.lb{position:fixed;inset:0;background:#000e;z-index:1000;overflow:auto;touch-action:pinch-zoom pan-x pan-y;animation:fade .2s}.lbw{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 10px 16px;box-sizing:border-box}.lb img{max-width:min(96vw,2000px);max-height:84vh;width:auto;height:auto;border-radius:8px;background:#fff;cursor:zoom-in;border:0}.lb.z .lbw{align-items:flex-start;justify-content:flex-start}.lb.z img{max-width:none;max-height:none;width:auto;cursor:zoom-out}.lbh{color:#dfe9f0;font-size:.82rem;margin:10px 0 0;text-align:center}.lbx{position:fixed;top:10px;right:10px;z-index:2;width:44px;height:44px;border-radius:50%;border:2px solid #fff;background:#0b3a55;color:#fff;font-size:1.2rem;font-weight:800;cursor:pointer}.lbx:focus-visible,figure img:focus-visible{outline:3px solid #16B14C;outline-offset:3px}html.lbo{overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mut);font-size:.88rem;margin:4px 0 8px}
.hx{position:relative;overflow:hidden;border-radius:22px;color:#fff;padding:40px 34px;background:linear-gradient(135deg,var(--navy) 0%,#035f8c 55%,#0291CE 100%);box-shadow:0 20px 50px #0a1f3355;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center}
.hx::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#009CD7 0 50%,#16B14C 50% 100%)}
.hx>*{position:relative;min-width:0}
.logo-x{height:54px;background:#fff;border-radius:12px;padding:6px 12px;margin-bottom:14px;box-shadow:0 6px 18px #0003;max-width:100%}
.eyb{display:inline-flex;align-items:center;gap:8px;font-size:.76rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9ff0bb}
.eyb::before{content:"";width:26px;height:2px;background:#16B14C}
.hx h2{font-size:clamp(1.7rem,4.4vw,3.1rem);line-height:1.07;margin:.35em 0 .3em;font-weight:800}
.hx h2 em{font-style:normal;color:#9ff0bb}
.hx p.sub{font-size:1.04rem;color:#e1eef7;max-width:580px;margin:0 0 20px}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.go{background:#0f7a35;color:#fff;border:none;font-weight:800;padding:13px 26px;font-size:1.02rem;box-shadow:0 8px 24px #16b14c55}
.go2{background:transparent;color:#fff;border:1px solid #ffffff66;padding:12px 18px}
.pbar{margin-top:18px;max-width:420px}.pbar small{color:#d3e4f0}.pbar div{height:8px;border-radius:9px;background:#ffffff26;overflow:hidden;margin-top:4px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#009CD7,#16B14C)}




@keyframes blink{50%{opacity:.2}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 6px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;border-top:3px solid var(--acc2)}
.stat b{display:block;font-size:1.6rem;line-height:1.1;color:var(--pri)}.stat span{font-size:.85rem;color:var(--mut)}
.mods{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:8px 0 10px}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;position:relative;overflow:hidden}
.mc .n{font-size:2.6rem;font-weight:800;color:color-mix(in srgb,var(--pri2) 25%,transparent);position:absolute;right:14px;top:4px}
.mc h3{margin:.4em 0 .2em;font-size:1.02rem}.mc p{margin:0;color:var(--mut);font-size:.88rem}
.mp{height:6px;background:var(--bd);border-radius:9px;margin-top:12px;overflow:hidden}.mp i{display:block;height:100%;background:linear-gradient(90deg,#009CD7,#16B14C)}
.sech{display:flex;align-items:center;gap:10px;margin:26px 0 4px;font-size:.8rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}.sech::after{content:"";flex:1;height:1px;background:var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:14px}
.grid .card{margin:0}.grid h4{margin:.4em 0}
.hero{background:linear-gradient(135deg,var(--navy),#035f8c 60%,#0291CE);color:#fff;border-radius:18px;padding:26px}
.hero h2{margin:.2em 0}
.ofc{width:100%;max-width:460px;justify-self:center}.himg{height:auto;border-radius:16px;background:#fff;cursor:zoom-in;box-shadow:0 8px 24px #0003}
.ofc .cur{animation:blink 1.1s steps(1) infinite}}
.ofc .arm{animation:type .5s ease-in-out infinite alternate;transform-origin:246px 136px}
@keyframes type{from{transform:rotate(0)}to{transform:rotate(-1.5deg)}}}}
.ofc .plant{animation:sw 4s ease-in-out infinite;transform-origin:35px 174px}@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
}
.vb{display:inline-block;font-size:.78rem;font-weight:800;border-radius:99px;padding:1px 10px;border:1px solid;white-space:nowrap}
.v-trivial{background:#e6f4ea;color:#14532d;border-color:#15803d}.v-tolerable{background:#e0f2fe;color:#0c4a6e;border-color:#0369a1}.v-moderado{background:#fef3c7;color:#713f12;border-color:#a16207}.v-importante{background:#ffedd5;color:#7c2d12;border-color:#c2410c}.v-intolerable{background:#fee2e2;color:#7f1d1d;border-color:#b91c1c}
.rk{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;border:1px solid var(--bd);border-left:5px solid var(--pri);border-radius:12px;padding:10px 12px;margin:10px 0;background:color-mix(in srgb,var(--pri) 5%,var(--card))}.rk small{color:var(--mut)}
.rc{font-weight:800;font-size:.8rem;background:var(--pri);color:var(--btnTxt);border-radius:8px;padding:1px 8px}
.ley{border-left:5px solid #7c3aed;background:color-mix(in srgb,#7c3aed 9%,var(--card));padding:12px 14px;border-radius:10px;margin:10px 0}
html[data-theme=dark] .ley{border-color:#c4b5fd}


button:disabled{opacity:.55;cursor:not-allowed}
.ub{max-width:200px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}.ub span{overflow:hidden;text-overflow:ellipsis}
body.noauth nav,body.noauth .prog,body.noauth #pct{display:none}
.auth{max-width:760px;margin:auto}.ah{grid-template-columns:1.3fr 1fr}.ah .ofc{max-width:260px}
.tabs{display:flex;gap:8px;margin:16px 0 0;flex-wrap:wrap}
.af label{display:block;font-weight:700;margin:10px 0;font-size:.92rem}.af input:not([type=checkbox]),.af select{display:block;width:100%;font:inherit;font-weight:400;padding:10px 12px;margin-top:4px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--txt)}
.af input:focus,.af select:focus{outline:3px solid color-mix(in srgb,var(--pri) 45%,transparent)}
.af .chk{display:flex;gap:8px;align-items:flex-start;font-weight:600}.af .chk input{width:20px;height:20px;flex:none;margin-top:2px}
.rgpd{font-size:.82rem}.err{color:var(--ko);font-weight:700;min-height:1.2em}
.sw{text-align:left}
[hidden]{display:none!important}nav a.lk{opacity:.6}nav a.lk .ck{opacity:1}.lockv h2{margin-top:0}#menu{display:none}
ul,ol{padding-left:1.3em}li{margin:3px 0}
@media(max-width:1000px){.mods{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.hx{grid-template-columns:1fr;padding:28px 20px 32px}.ofc{max-width:260px;order:-1}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){nav{position:fixed;left:0;top:59px;background:var(--card);z-index:9;transform:translateX(-105%);transition:transform .3s;border-right:1px solid var(--bd);width:min(290px,86vw)}nav.open{transform:none}#menu{display:inline-block}.prog{display:none}}
@media(max-width:600px){main{padding:14px 12px}.mods{grid-template-columns:1fr}.sem{grid-template-columns:1fr}.logo-h{height:28px}.logo-x{height:44px}header{gap:8px;padding:10px}header h1{font-size:.88rem}.card{padding:14px}details.bl>div{padding:0 12px 12px}}
@media(max-width:420px){#pct{display:none}.ub{max-width:110px;padding:6px 10px}.ah{padding:22px 16px}header h1 span{max-width:40vw}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header,nav,.pn,.noprint,.alert{display:none!important}main{padding:0}body{background:#fff;color:#000}.wrap{display:block}details.bl{break-inside:avoid}}
.fig{margin:.3rem 0 .9rem}.fig svg{display:block;width:100%;height:auto;max-width:520px;margin:0 auto;border-radius:14px;border:1px solid var(--bd)}.fig img{cursor:zoom-in;display:block;width:100%;height:auto;max-width:720px;margin:0 auto;border-radius:14px;border:1px solid var(--bd);background:#fff}.fig figcaption{font-size:.86rem;color:var(--mut);text-align:center;margin-top:.35rem}
</style>
</head>

const fig=k=>`<figure><img class="zoom" src="${IMG[k][0]}" alt="${IMG[k][1]}" loading="lazy"><figcaption>${IMG[k][1]} · toca para ampliar</figcaption></figure>`;
const T=(h,rows)=>`<div class="tbl"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
const UL=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join("")}</ul>`;
const OL=a=>`<ol>${a.map(x=>`<li>${x}</li>`).join("")}</ol>`;

const LEY=s=>`<div class="ley">⚖️ <b>Texto legal.</b> ${s}</div>`;
const V=v=>`<span class="vb v-${v.toLowerCase()}">${v}</span>`;
const M1={t:"Marco preventivo: normativa, prevención y mapa de tareas",fmin:3,s:"La normativa que te protege, las normas específicas de la clínica dental, cómo se elige una medida preventiva y cómo se valoran los riesgos, y el mapa de tareas y exposición del puesto.",L:[
{t:"La normativa que te protege",ico:"⚖️",min:7,src:"Ley 31/1995, arts. 14, 18-22 y 25-29; RD 39/1997",
obj:["Conocer la base legal de la prevención: Ley 31/1995 y RD 39/1997.","Identificar tus derechos de información, formación y participación.","Saber cómo se protege tu salud y qué hacer ante un riesgo grave e inminente."],
b:[["1. Marco general",FIGI("assets/l01-normativa.webp","Higienista bucodental revisando la normativa de prevención en el gabinete","Las normas se traducen en decisiones diarias: medios adecuados, conocer el riesgo y participar en su control.")+`<p>La <b>Ley 31/1995 de Prevención de Riesgos Laborales</b> es la base del sistema. El <b>RD 39/1997</b> regula la organización preventiva y los servicios de prevención.</p>`+UL(["La empresa <b>evalúa, planifica y revisa</b> los riesgos.","El personal <b>aplica las instrucciones</b> y <b>comunica las incidencias</b>."])],
["2. Protección y participación",LEY("Art. 19.1 Ley 31/1995: el empresario deberá garantizar que cada trabajador reciba una formación teórica y práctica, suficiente y adecuada, en materia preventiva, tanto en el momento de su contratación como cuando se produzcan cambios en las funciones que desempeñe o se introduzcan nuevas tecnologías o cambios en los equipos de trabajo. Su coste no recaerá en ningún caso sobre los trabajadores.")+UL(["Debes recibir <b>información comprensible</b> y <b>formación suficiente y adecuada</b> al puesto, sin coste.","La formación se actualiza cuando cambian tareas o riesgos.","Participa mediante las vías del centro y la representación preventiva (art. 18)."])],
["3. Salud y situaciones de especial protección",UL(["La <b>vigilancia de la salud</b> se vincula a los riesgos y respeta la confidencialidad. Como regla general requiere tu consentimiento, con las excepciones legales (art. 22).","La empresa recibe <b>conclusiones preventivas</b>, no tu historia clínica.","Deben valorarse las necesidades de las personas <b>especialmente sensibles</b> (art. 25) y la protección durante <b>embarazo y lactancia</b> (art. 26)."])],
["4. Riesgo grave e inminente y tus obligaciones",ALERT("<b>Si existe riesgo grave e inminente</b>, interrumpe la tarea y aléjate del peligro cuando sea necesario, avisando de inmediato según el procedimiento del centro (art. 21).")+LEY("Art. 29.1: corresponde a cada trabajador velar, según sus posibilidades y mediante el cumplimiento de las medidas de prevención que en cada caso sean adoptadas, por su propia seguridad y salud en el trabajo y por la de aquellas otras personas a las que pueda afectar su actividad profesional.")]],
key:"La empresa evalúa, planifica y revisa; tú aplicas las instrucciones y comunicas. Tienes derecho a formación gratuita y adecuada al puesto, a participar y a una vigilancia de la salud confidencial. Ante riesgo grave e inminente, interrumpe, aléjate y avisa.",
q:[["¿Cuál es la ley que sirve de base al sistema de prevención de riesgos laborales?",["La Ley 31/1995 de Prevención de Riesgos Laborales","La Ley General de Sanidad","El Estatuto de los Trabajadores únicamente","La Ley de Protección de Datos"],0],
["La formación preventiva del puesto:",["Debe ser suficiente, adecuada y sin coste para ti","La paga el trabajador si es fuera de la jornada","Solo se da una vez en toda la vida laboral","Es voluntaria para la empresa"],0],
["En la vigilancia de la salud, la empresa recibe:",["Las conclusiones preventivas, no tu historia clínica","Tu historia clínica completa","Los diagnósticos de cada trabajador","Nada, ni siquiera conclusiones"],0],
["Ante un riesgo grave e inminente debes:",["Interrumpir la tarea, alejarte del peligro y avisar de inmediato","Terminar la atención y avisar al final del día","Esperar instrucciones por escrito","Seguir trabajando con más cuidado"],0],
["¿Cuándo debe actualizarse la formación preventiva?",["Cuando cambian las tareas o los riesgos","Nunca","Solo cada diez años","Solo si hay un accidente grave"],0]]},
{t:"Normas específicas de la clínica dental",ico:"📚",min:6,src:"RD 664/1997; Orden ESS/1451/2013; RD 374/2001; RD 773/1997; RD 1215/1997; RD 1029/2022; LO 3/2007; RD 1594/1994",
obj:["Conocer la normativa específica que se aplica a los riesgos de la clínica dental.","Saber qué normas regulan la radiología y la igualdad.","Conocer los límites de las funciones del higienista."],
b:[["1. Riesgos biológicos y cortopunzantes",FIGI("assets/l02-normas.webp","Normativa específica aplicada en la clínica dental","Cada grupo de riesgos tiene reglas propias; su aplicación depende de los equipos, productos y tareas reales.")+T(["Norma","Qué regula"],[["RD 664/1997","Exposición a agentes biológicos"],["Orden ESS/1451/2013","Prevención de lesiones por instrumental cortante y punzante en el ámbito sanitario"]])],
["2. Químicos, equipos, lugares y protección",T(["Norma","Qué regula"],[["RD 374/2001","Agentes químicos"],["RD 773/1997","Uso de equipos de protección individual (EPI)"],["RD 1215/1997","Equipos de trabajo"],["RD 614/2001","Riesgo eléctrico"],["RD 486/1997","Lugares de trabajo"],["RD 485/1997","Señalización"],["RD 487/1997","Manipulación manual de cargas"],["RD 488/1997","Pantallas de visualización"]])],
["3. Agentes físicos y radiología",T(["Norma","Qué regula"],[["RD 286/2006","Ruido"],["RD 1311/2005","Vibraciones"],["RD 486/2010","Radiaciones ópticas artificiales"],["RD 1029/2022 y RD 1085/2009","Protección radiológica e instalaciones de rayos X de diagnóstico"]])+ALERT("La titulación de higienista <b>no sustituye la acreditación</b> necesaria para operar equipos de rayos X.")],
["4. Igualdad, respeto y funciones profesionales",UL(["<b>LO 3/2007</b>, especialmente arts. 7 y 48: acoso sexual y por razón de sexo.","<b>Ley 4/2023 y RD 1026/2024</b>: medidas LGTBI en su ámbito de aplicación.","<b>RD 1594/1994</b>: funciones del higienista como colaborador del facultativo. No incluye prescribir tratamientos ni aplicar anestésicos."])+NOTE("Las Notas Técnicas de Prevención (NTP) y las guías técnicas son criterios de apoyo, no leyes.")]],
key:"Cada riesgo tiene su norma: biológicos (RD 664/1997), cortopunzantes (Orden ESS/1451/2013), químicos (RD 374/2001), EPI (RD 773/1997), radiología (RD 1029/2022). Ser higienista no habilita por sí solo para operar rayos X ni para prescribir o anestesiar.",
q:[["¿Qué norma regula la prevención de lesiones por instrumental cortante y punzante en el ámbito sanitario?",["La Orden ESS/1451/2013","El RD 488/1997","El RD 286/2006","La LO 3/2007"],0],
["El RD 664/1997 regula la exposición a:",["Agentes biológicos","Ruido","Pantallas de visualización","Señalización"],0],
["La titulación de higienista bucodental:",["No sustituye la acreditación necesaria para operar equipos de rayos X","Permite operar cualquier equipo de rayos X","Permite aplicar anestésicos","Permite prescribir tratamientos"],0],
["Según el RD 1594/1994, las funciones del higienista:",["No incluyen prescribir tratamientos ni aplicar anestésicos","Incluyen prescribir medicación","Incluyen aplicar anestesia local","Sustituyen al facultativo"],0],
["Las NTP y las guías técnicas son:",["Criterios técnicos de apoyo, no leyes","Leyes de obligado cumplimiento","Reglamentos europeos","Normas internas de cada clínica"],0]]},
{t:"Prevenir: del origen a la persona",ico:"🛡️",min:8,src:"Ley 31/1995, arts. 15, 16, 17 y 29; RD 39/1997; Orden ESS/1451/2013",
obj:["Aplicar el orden de las medidas: eliminar, sustituir, controlar, organizar y EPI.","Entender de forma general cómo se valoran los riesgos.","Saber comunicar los incidentes aunque nadie se haya lesionado."],
b:[["1. Elegir la medida que controla el origen",FIGI("assets/l03-prevenir.webp","Jerarquía de medidas preventivas en la clínica dental","La protección más eficaz empieza antes de ponerse los guantes.")+FLOW(["1 Eliminar","2 Sustituir","3 Controlar","4 Organizar","5 EPI"])+UL(["<b>Eliminar</b> lo innecesario: retirar instrumentos defectuosos y evitar agujas sin necesidad clínica.","<b>Sustituir</b>: escoger productos menos peligrosos compatibles con el uso sanitario.","<b>Controlar</b> el entorno: aspiración eficaz, ventilación y equipos con dispositivos de seguridad.","<b>Organizar</b>: tiempos suficientes, separación de circuitos y mantenimiento.","<b>EPI</b>: la última barrera, cuando el riesgo no se ha podido evitar por otros medios."])],
["2. Cómo se valoran los riesgos (explicación general)",`<p>La empresa, con su servicio de prevención, <b>evalúa</b> los riesgos que no se han podido evitar (art. 16 LPRL y RD 39/1997). Un método muy utilizado combina dos factores:</p>`+UL(["<b>Probabilidad</b> de que se produzca el daño (baja, media o alta).","<b>Consecuencia</b> o gravedad del daño (leve, grave o muy grave)."])+T(["Consecuencia \\ Probabilidad","Baja","Media","Alta"],[["Leve",V("Trivial"),V("Tolerable"),V("Moderado")],["Grave",V("Tolerable"),V("Moderado"),V("Importante")],["Muy grave",V("Moderado"),V("Importante"),V("Intolerable")]])+`<p>Cuanto mayor es el nivel, más urgentes son las medidas: en un riesgo <b>importante</b> no debe comenzarse el trabajo hasta reducirlo, y en uno <b>intolerable</b> no se comienza ni se continúa. La evaluación se revisa cuando cambian las condiciones, tras un daño a la salud o cuando los controles muestran que las medidas no bastan.</p>`],
["3. Aplicar las instrucciones del puesto",UL(["Utiliza solo equipos para los que hayas recibido formación y autorización.","Respeta resguardos y no improvises reparaciones.","Usa y conserva los EPI previstos, comunica su deterioro y solicita reposición.","No asumas tareas fuera de tus competencias."])],
["4. Aprender de los incidentes",`<p>Una aguja que aparece en una bandeja, una bolsa rota o un fallo de aspiración <b>deben comunicarse aunque nadie se haya lesionado</b>.</p>`+UL(["Describe la tarea, el lugar y qué falló.","El análisis debe corregir las condiciones del sistema y evitar la repetición, no buscar culpables."])]],
key:"Primero se elimina o sustituye el peligro, después se controla el entorno y se organiza el trabajo; el EPI es la última barrera. Los riesgos se valoran combinando probabilidad y consecuencia. Los incidentes sin lesión también se comunican.",
q:[["¿Cuál es el orden correcto de las medidas preventivas?",["Eliminar, sustituir, controlar, organizar y EPI","EPI, organizar, controlar, sustituir y eliminar","Solo EPI","Organizar y después eliminar"],0],
["Retirar instrumentos defectuosos y evitar agujas sin necesidad clínica es un ejemplo de:",["Eliminar el peligro","Usar EPI","Señalizar","Vigilancia de la salud"],0],
["Para valorar un riesgo se combinan:",["La probabilidad de que ocurra el daño y su consecuencia","La edad y la antigüedad del trabajador","El número de pacientes y el horario","El precio del equipo y su marca"],0],
["Si un riesgo resulta «importante», lo adecuado es:",["No comenzar el trabajo hasta reducirlo","Trabajar con normalidad","Revisarlo dentro de cinco años","Ignorarlo si nadie se ha lesionado"],0],
["Aparece una aguja en una bandeja y nadie se ha pinchado. Debes:",["Comunicarlo igualmente para corregir el fallo","No decir nada porque no hubo lesión","Tirarla con la mano y olvidarlo","Esperar a que alguien se pinche para avisar"],0]]},
{t:"Mapa de tareas y exposición",ico:"🗺️",min:6,src:"Ley 31/1995, art. 16; RD 39/1997",
obj:["Reconocer que el riesgo cambia a lo largo de la jornada.","Relacionar cada grupo de tareas con sus riesgos principales.","Comunicar cualquier actividad nueva para que se revise la prevención."],
b:[["1. Preparar y atender",FIGI("assets/l04-tareas.webp","Distintas tareas de la jornada de una higienista bucodental","El riesgo no solo está en el momento de atender al paciente.")+T(["Tarea","Riesgos principales"],[["Revisión de equipos, colocación de material y acogida","Golpes, tropiezos, errores de preparación y carga mental"],["Detartrajes, pulidos y otras técnicas autorizadas","Salpicaduras, aerosoles, contacto con sangre, posturas mantenidas y movimientos de precisión"]])],
["2. Asistir y reprocesar",T(["Tarea","Riesgos principales"],[["Asistencia al facultativo","Coordinación de movimientos, instrumental punzante y proyección de partículas"],["Transporte, limpieza y esterilización","Cortes, exposición química y biológica, quemaduras y manipulación de cargas"]])],
["3. Registrar, mantener y cerrar",T(["Tarea","Riesgos principales"],[["Historia clínica y agenda","Pantallas, sedestación, fatiga visual y exigencias de atención"],["Gestión de residuos, limpieza y cierre","Exposición a contaminantes, derrames, caídas y equipos calientes o energizados"]])],
["4. Antes de empezar",NOTE("<b>Identifica qué tareas realizas realmente.</b> Informa al responsable de cualquier actividad nueva para que se revise la prevención. Este mapa es orientativo: debe contrastarse con la evaluación de riesgos de tu centro.")]],
key:"El riesgo cambia durante la jornada: preparar, atender, asistir, reprocesar, registrar y cerrar tienen riesgos distintos. Comunica cualquier tarea nueva para que se revise la prevención.",
q:[["¿En qué momento de la jornada existe riesgo?",["En todas las fases: preparar, atender, reprocesar, registrar y cerrar","Solo mientras se atiende al paciente","Solo al esterilizar","Solo en la recepción"],0],
["Los detartrajes y pulidos exponen sobre todo a:",["Salpicaduras, aerosoles, contacto con sangre y posturas mantenidas","Ruido de tráfico","Caída de altura","Radiación solar"],0],
["La limpieza y esterilización del instrumental implica riesgo de:",["Cortes, exposición química y biológica, quemaduras y cargas","Ninguno, porque el material ya está usado","Solo fatiga visual","Solo riesgo eléctrico"],0],
["Si empiezas a realizar una actividad nueva debes:",["Informar al responsable para que se revise la prevención","Hacerla sin decir nada","Esperar a la próxima formación anual","Pedir a un compañero que la haga por ti"],0]]}
]};
const M2={t:"Riesgo biológico, higiene de manos y aerosoles",fmin:3,s:"Las vías de entrada de los agentes biológicos, la higiene de manos y los hábitos seguros, y cómo reducir y controlar los aerosoles y las salpicaduras.",L:[
{t:"Riesgo biológico: las vías de entrada",ico:"🦠",min:7,src:"RD 664/1997; INSST, gestión del riesgo biológico; Consejo General de Dentistas, accidente biológico",
obj:["Identificar las vías de entrada de los agentes biológicos.","Conocer los agentes más relevantes en la clínica dental.","Aplicar las precauciones estándar y conocer el papel de las vacunas."],
b:[["1. Dónde puede producirse",FIGI("assets/l11-biologico.webp","Vías de entrada del riesgo biológico en el gabinete dental","La sangre, la saliva y el material contaminado pueden actuar como vehículos de exposición.")+FLOW(["Punción / corte","Mucosas","Piel lesionada","Inhalación"])+UL(["<b>Punción o corte</b> con agujas, curetas, sondas, fresas y otros instrumentos.","<b>Salpicaduras</b> sobre ojos, nariz o boca.","Contacto sobre <b>piel lesionada</b>.","<b>Inhalación</b> de partículas respiratorias y aerosoles, según el procedimiento, el agente y la ventilación."])],
["2. Qué puede causar",UL(["Entre los agentes relevantes están los virus de la <b>hepatitis B y C</b>, el <b>VIH</b> por exposición sanguínea y los <b>patógenos respiratorios</b>.","Su transmisión no es idéntica y requiere una valoración específica."])+ALERT("El aspecto del paciente o una historia clínica sin alertas <b>no permiten descartar el riesgo</b>.")],
["3. Medidas que se complementan",UL(["<b>Precauciones estándar</b> para toda atención, con cualquier paciente.","Higiene de manos, técnica segura, reprocesado, limpieza, ventilación y EPI."])],
["4. Vacunación",`<p>Valora las vacunas con vigilancia de la salud, especialmente la de la <b>hepatitis B</b> si existe exposición. Las vacunas indicadas se ofrecen conforme a la evaluación de riesgos.</p>`+NOTE("Las vacunas <b>no sustituyen</b> las barreras ni el seguimiento tras un accidente.")]],
key:"Los agentes biológicos entran por punción o corte, mucosas, piel lesionada e inhalación. Aplica precauciones estándar con todos los pacientes: el aspecto o la historia clínica no descartan el riesgo. La vacuna de la hepatitis B se valora con vigilancia de la salud y no sustituye las barreras.",
q:[["¿Cuál de estas es una vía de entrada de agentes biológicos?",["Salpicadura sobre ojos, nariz o boca","Contacto con piel sana e intacta durante un segundo","Mirar la pantalla del ordenador","Escuchar la turbina"],0],
["Un paciente con buen aspecto y sin alertas en su historia clínica:",["No permite descartar el riesgo biológico","Elimina el riesgo biológico","Permite no usar guantes","Permite no reprocesar el instrumental"],0],
["Las precauciones estándar se aplican:",["En toda atención, a todos los pacientes","Solo a pacientes con infección conocida","Solo en cirugía","Solo cuando lo pide el paciente"],0],
["Respecto a la vacuna de la hepatitis B:",["Se valora con vigilancia de la salud y no sustituye las barreras","Hace innecesario el uso de guantes","Es obligatorio rechazarla","Protege también frente al VIH"],0]]},
{t:"Higiene de manos y hábitos seguros",ico:"🧼",min:7,src:"CDC, precauciones estándar en odontología; OMS, higiene de manos en la atención sanitaria",
obj:["Saber cuándo higienizar las manos.","Aplicar la técnica completa y los tiempos de referencia.","Evitar la contaminación cruzada."],
b:[["1. Cuándo higienizar",FIGI("assets/l12-manos.webp","Higienista realizando la higiene de manos","Los guantes protegen durante la tarea, pero la higiene de manos sigue siendo necesaria.")+UL(["<b>Antes</b> del contacto con el paciente y antes de una tarea limpia o aséptica.","<b>Después</b> del riesgo de contacto con fluidos, de tocar al paciente o su entorno y <b>tras quitarte los guantes</b>."])+`<p>Usa <b>agua y jabón</b> cuando haya suciedad visible. En las demás situaciones, utiliza el preparado autorizado conforme al protocolo.</p>`],
["2. Técnica completa",FLOW(["1 Palmas","2 Dorsos","3 Entre dedos","4 Pulgares","5 Puntas"])+UL(["Extiende el producto por palmas, dorsos, espacios entre dedos, dorso de los dedos, pulgares y puntas de los dedos.","Como referencia: <b>fricción alcohólica 20-30 segundos</b> y <b>lavado 40-60 segundos</b>.","Seca bien las manos tras el lavado.","Mantén uñas cortas y retira anillos, pulseras y reloj para el trabajo asistencial."])],
["3. Evitar la contaminación cruzada",UL(["Cubre pequeñas lesiones con apósito impermeable.","No comas, bebas ni guardes alimentos en zonas asistenciales o de reprocesado.","No toques el móvil, el pelo, la cara, pomos o el teclado con guantes contaminados.","Si lo haces: retíralos, higieniza y reinicia con material limpio."])]],
key:"Higieniza antes del paciente o de una tarea aséptica y después de fluidos, del paciente o su entorno y de quitarte los guantes. Fricción 20-30 s, lavado 40-60 s. Sin anillos ni reloj, uñas cortas, y nada de tocar móvil o teclado con guantes contaminados.",
q:[["¿Es necesaria la higiene de manos al quitarse los guantes?",["Sí, siempre tras retirarlos","No, los guantes ya protegen","Solo si están rotos","Solo al final de la jornada"],0],
["Si las manos tienen suciedad visible debes usar:",["Agua y jabón","Solo el preparado de base alcohólica","Un pañuelo seco","Nada, basta con ponerse guantes"],0],
["Tiempo de referencia de la fricción con preparado alcohólico:",["20-30 segundos","3 segundos","5 minutos","No importa el tiempo"],0],
["Para el trabajo asistencial debes:",["Llevar uñas cortas y retirar anillos, pulseras y reloj","Llevar el reloj para controlar el tiempo","Usar uñas largas protegidas con guantes","Llevar anillos bajo el guante"],0],
["Has tocado el teclado con los guantes contaminados. ¿Qué haces?",["Retiras los guantes, higienizas y reinicias con material limpio","Sigues trabajando con los mismos guantes","Limpias los guantes con alcohol y continúas","Te pones otro guante encima"],0]]},
{t:"Aerosoles y salpicaduras",ico:"💨",min:7,src:"INSST, gestión del riesgo biológico; CDC, precauciones estándar y calidad del agua de la unidad dental",
obj:["Reducir la generación de aerosoles y capturarlos en el origen.","Controlar el aire, las superficies y los circuitos de agua.","Seleccionar la protección ocular y respiratoria adecuada."],
b:[["1. Reducir la generación y capturarla",FIGI("assets/l13-aerosoles.webp","Uso de aspiración de alto volumen durante un procedimiento con ultrasonidos","El ultrasonido, la jeringa aire-agua y algunos procedimientos pueden dispersar material desde la boca y los circuitos de agua.")+UL(["Prepara <b>aspiración de alto volumen</b> cuando proceda y comprueba su funcionamiento. Colócala cerca de la fuente sin interferir con la técnica.","Coordina la asistencia y aplica aislamiento del campo cuando sea clínicamente viable.","Regula los equipos conforme al fabricante, evitando un uso innecesario del spray."])],
["2. Controlar aire, superficies y circuitos",UL(["Mantén la ventilación prevista para el gabinete, sin bloquear rejillas. <b>La climatización por sí sola no garantiza la renovación de aire.</b>","Programa la limpieza de superficies y el mantenimiento del sistema de agua y aspiración.","No dirijas aire comprimido hacia ropa o piel.","Los enjuagues no sustituyen estas medidas."])],
["3. Seleccionar la protección adecuada",UL(["Protege ojos y mucosas frente a salpicaduras: las gafas graduadas habituales <b>no sustituyen</b> la protección ocular.","Si la evaluación exige protección respiratoria frente a aerosoles infecciosos, usa <b>FFP2 o FFP3</b> según el riesgo y el procedimiento.","Ante síntomas respiratorios relevantes o sospecha de infección transmisible, informa al facultativo y aplica el circuito de atención o derivación de la clínica."])+ALERT("Una <b>pantalla facial</b> no sustituye a la protección respiratoria. Una <b>mascarilla quirúrgica</b> no equivale a una FFP2.")]],
key:"Reduce y captura los aerosoles en el origen con aspiración de alto volumen y uso racional del spray; mantén la ventilación y los circuitos de agua. Gafas graduadas no son protección ocular, la pantalla no protege las vías respiratorias y la mascarilla quirúrgica no es una FFP2.",
q:[["¿Qué medida reduce los aerosoles en el origen?",["Aspiración de alto volumen cerca de la fuente","Subir la climatización","Abrir la puerta de la sala de espera","Hacer que el paciente se enjuague y no hacer nada más"],0],
["Las gafas graduadas habituales:",["No sustituyen la protección ocular","Son protección ocular suficiente","Sustituyen la pantalla facial","Protegen frente a aerosoles infecciosos"],0],
["Una pantalla facial:",["No sustituye a la protección respiratoria","Equivale a una FFP2","Equivale a una FFP3","Hace innecesaria la mascarilla"],0],
["Respecto a la climatización del gabinete:",["Por sí sola no garantiza la renovación del aire","Siempre renueva el aire suficiente","Sustituye a la aspiración","Elimina los aerosoles"],0],
["Si la evaluación exige protección respiratoria frente a aerosoles infecciosos se usa:",["FFP2 o FFP3 según el riesgo y el procedimiento","Mascarilla quirúrgica","Solo pantalla facial","Gafas graduadas"],0]]}
]};
const M3={t:"Instrumental cortopunzante y accidente biológico",fmin:3,s:"Cómo organizar el trabajo con instrumental cortante y punzante y qué hacer, paso a paso, ante un pinchazo, un corte o una salpicadura con material biológico.",L:[
{t:"Instrumental cortante y punzante",ico:"💉",min:8,src:"Orden ESS/1451/2013",
obj:["Trabajar con orden y dispositivos de seguridad.","Eliminar el material punzante de forma inmediata y segura.","Evitar pinchazos durante la limpieza del instrumental."],
b:[["1. Antes y durante la técnica",FIGI("assets/l21-cortopunzantes.webp","Bandeja ordenada y contenedor rígido para cortopunzantes al alcance","Organiza el trabajo para que ninguna mano tenga que buscar una punta oculta.")+FLOW(["Orden visible","Dispositivo seguro","Descarte inmediato"])+UL(["Prepara una bandeja ordenada y limita el instrumental al necesario. Revisa su estado.","Utiliza <b>dispositivos de seguridad</b> cuando proceda y estés formado en su activación.","Acordad una zona o técnica segura de transferencia: evita pasar puntas de mano a mano sin control visual.","Avisa antes de acercar o retirar instrumental."])],
["2. Después de usarlo",UL(["Elimina <b>inmediatamente</b> el material punzante desechable en un <b>contenedor rígido</b> apropiado, estable, cercano y accesible.","No lo llenes por encima de su marca."])+ALERT("<b>No reencapuches</b> agujas usadas. No dobles, rompas ni manipules puntas para que quepan. No introduzcas la mano en el contenedor ni recuperes objetos.")],
["3. Durante la limpieza",UL(["Retira de forma segura las fresas de las piezas antes del reprocesado, según el fabricante.","Transporta los instrumentos en recipiente <b>cerrado, resistente y claramente identificado</b>.","No dejes puntas en lavabos ni bajo gasas.","Prioriza la limpieza automatizada compatible.","Los guantes de limpieza no hacen la mano invulnerable a los pinchazos."])+CASO("La bandeja sorpresa","Tras una atención aparece una aguja usada escondida bajo una gasa. Nadie se ha pinchado. ¿Qué haces?","Detén la manipulación insegura, evita cogerla con la mano, utiliza el procedimiento de eliminación seguro y comunica el incidente. Revisa la segregación y quién es responsable de retirar el material al terminar la técnica.")]],
key:"Bandeja ordenada, dispositivos de seguridad, transferencia controlada y descarte inmediato en contenedor rígido cercano, sin llenarlo por encima de la marca. Nunca reencapuches ni metas la mano en el contenedor. Transporta el instrumental en recipiente cerrado y resistente.",
q:[["¿Qué debes hacer con una aguja usada?",["Desecharla inmediatamente en el contenedor rígido sin reencapuchar","Reencapucharla con las dos manos","Doblarla para que quepa mejor","Dejarla en la bandeja hasta el final del día"],0],
["El contenedor de cortopunzantes debe:",["Estar cercano, estable y no llenarse por encima de su marca","Llenarse hasta que no quepa nada más","Estar en otra sala para que no estorbe","Vaciarse a mano para reutilizarlo"],0],
["¿Cómo se transporta el instrumental usado hasta la zona de limpieza?",["En un recipiente cerrado, resistente e identificado","En la mano envuelto en una gasa","En el bolsillo de la bata","Dentro de una bolsa de plástico fina"],0],
["Los guantes de limpieza resistentes:",["No hacen la mano invulnerable a los pinchazos","Impiden cualquier pinchazo","Permiten meter la mano en el contenedor","Sustituyen la técnica segura"],0],
["Para pasar instrumental punzante al facultativo:",["Se acuerda una zona o técnica segura de transferencia y se avisa","Se pasa de mano a mano sin mirar","Se lanza a la bandeja","Se deja sobre el pecho del paciente"],0]]},
{t:"Accidente con material biológico",ico:"🚑",min:8,src:"Consejo General de Dentistas, guía de accidente biológico; Orden ESS/1451/2013",
obj:["Realizar los cuidados locales correctos tras un pinchazo o una salpicadura.","Comunicar y acudir de inmediato a la asistencia prevista.","Registrar el accidente y seguir todas las revisiones."],
b:[["1. Interrumpir y realizar cuidados locales",FIGI("assets/l22-accidente.webp","Lavado de una herida por pinchazo con agua y jabón","Un pinchazo o una salpicadura en mucosas requiere atención rápida, incluso si la lesión parece mínima.")+T(["Exposición","Qué hacer"],[["Punción o corte","Lava con agua y jabón, sin exprimir, frotar agresivamente ni succionar. Deja que el sangrado sea espontáneo; aplica el antiséptico indicado y cubre."],["Ojos o mucosas","Irriga de inmediato con abundante agua o suero. No utilices lejía, alcohol ni sustancias irritantes sobre los tejidos."]])],
["2. Comunicar y acudir de inmediato",UL(["Avisa al responsable y activa la asistencia urgente prevista, <b>sin esperar a acabar el turno</b> ni a obtener resultados del paciente fuente.","La profilaxis frente al VIH, si se indica, debe iniciarse <b>cuanto antes</b>.","El personal sanitario valorará el tipo de exposición, hepatitis B, C y VIH, vacunación, analíticas y seguimiento.","La obtención de información del paciente debe respetar el consentimiento y la confidencialidad."])],
["3. Registrar y evitar la repetición",UL(["Anota hora, tarea, instrumento, fluido, zona afectada y EPI, sin manipular ni transportar una aguja suelta.","Sigue todas las revisiones indicadas: <b>una primera prueba negativa no cierra el seguimiento</b>.","Investiga las causas para corregir el proceso."])+NOTE("<b>Ruta urgente del centro.</b> Debe estar definida y accesible: responsable, centro asistencial, teléfono y atención fuera del horario habitual. Comprueba que la conoces antes de necesitarla.")]],
key:"Pinchazo o corte: lava con agua y jabón sin exprimir ni succionar, antiséptico y cubre. Mucosas: irriga con abundante agua o suero. Avisa y acude de inmediato, sin esperar al final del turno; la profilaxis, si se indica, cuanto antes. Registra el accidente y completa el seguimiento.",
q:[["Tras un pinchazo con una aguja usada debes:",["Lavar con agua y jabón sin exprimir ni succionar","Exprimir la herida con fuerza","Succionar la herida","Aplicar lejía"],0],
["Ante una salpicadura en los ojos:",["Irrigar de inmediato con abundante agua o suero","Frotar con alcohol","Aplicar lejía diluida","Esperar a terminar la atención"],0],
["¿Cuándo debes comunicar el accidente y acudir a la asistencia?",["De inmediato, sin esperar a acabar el turno","Al final de la jornada","Cuando tengas los resultados del paciente","Solo si aparecen síntomas"],0],
["Si la primera prueba tras el accidente es negativa:",["Debes seguir todas las revisiones indicadas","Ya no hace falta seguimiento","Puedes olvidar el accidente","No hace falta registrarlo"],0],
["La ruta urgente ante un accidente biológico debe incluir:",["Responsable, centro asistencial, teléfono y atención fuera de horario","Solo el nombre del paciente","Solo el teléfono del proveedor de guantes","Nada, se improvisa en el momento"],0]]}
]};
const M4={t:"Reprocesado del instrumental, residuos y circuitos de agua",fmin:3,s:"La secuencia de limpieza, desinfección y esterilización, la gestión de residuos, la limpieza de superficies y derrames y el mantenimiento del agua y la aspiración.",L:[
{t:"Limpieza, desinfección y esterilización",ico:"♨️",min:8,src:"CDC, esterilización y desinfección en odontología; instrucciones de los fabricantes",
obj:["Seguir la secuencia de reprocesado de sucio a almacén.","Diferenciar desinfección de esterilización.","Saber cuándo no debe liberarse un material."],
b:[["1. Recibir y limpiar",FIGI("assets/l31-esterilizacion.webp","Circuito de reprocesado del instrumental desde la zona sucia hasta el almacén","Reprocesar exige una secuencia controlada y un circuito que separe material sucio y limpio.")+FLOW(["1 Sucio","2 Limpieza","3 Revisión","4 Esterilización","5 Almacén"])+UL(["Usa recipientes seguros para transportar y recibir.","Prepara guantes resistentes apropiados, protección ocular/facial y ropa protectora según la exposición.","Prioriza equipos de limpieza compatibles con el material. Evita el cepillado que proyecte gotas; si es imprescindible, utiliza la técnica validada.","<b>No metas la mano en la cuba de ultrasonidos en funcionamiento.</b>"])],
["2. Inspeccionar, acondicionar y esterilizar",UL(["Tras la limpieza, seca e inspecciona.","Envasa, identifica y carga sin sobrecargar, siguiendo las instrucciones del instrumental y del esterilizador.","El material crítico y el semicrítico termorresistente requieren <b>esterilización por calor</b> conforme al procedimiento."])+ALERT("Una desinfección superficial <b>no equivale</b> a esterilizar.")],
["3. Comprobar y liberar",UL(["Verifica parámetros e indicadores físicos, químicos y biológicos con la frecuencia establecida.","Documenta la trazabilidad.","<b>No liberes material</b> si el ciclo falla o el paquete está húmedo, abierto o deteriorado: inmoviliza, comunica y reprocesa según el procedimiento.","Deja enfriar antes de manipular."])]],
key:"Sucio → limpieza → revisión → esterilización → almacén, separando circuitos. Nada de manos en la cuba de ultrasonidos en marcha. El material crítico se esteriliza por calor; desinfectar no es esterilizar. Si el ciclo falla o el paquete está húmedo o abierto, no se libera.",
q:[["¿Cuál es la secuencia correcta de reprocesado?",["Sucio, limpieza, revisión, esterilización y almacén","Almacén, esterilización, limpieza y sucio","Esterilizar sin limpiar previamente","Limpiar y guardar directamente"],0],
["Con la cuba de ultrasonidos en funcionamiento:",["No se debe meter la mano","Se puede meter la mano con guantes de nitrilo","Se mete la mano para acelerar la limpieza","Se pueden sacar las piezas con los dedos"],0],
["Una desinfección superficial:",["No equivale a esterilizar","Equivale a esterilizar","Sustituye al autoclave","Es suficiente para el material crítico"],0],
["Si al terminar el ciclo el paquete está húmedo o abierto:",["No se libera: se inmoviliza, se comunica y se reprocesa","Se usa igualmente","Se seca con una toalla y se usa","Se guarda en el almacén"],0],
["Antes de manipular el material recién esterilizado debes:",["Dejarlo enfriar","Cogerlo con la mano desnuda","Enfriarlo con agua","Sacudirlo"],0]]},
{t:"Residuos, superficies y circuitos de agua",ico:"🗑️",min:7,src:"Normativa autonómica de residuos sanitarios; CDC, agua de la unidad dental; fichas de datos de seguridad",
obj:["Separar los residuos en el origen según el plan del centro.","Limpiar superficies y recoger derrames biológicos con seguridad.","Mantener el sistema de agua y aspiración."],
b:[["1. Residuos sanitarios y químicos",FIGI("assets/l32-residuos.webp","Separación de residuos sanitarios en la clínica dental","Separar en el origen protege a quien usa el material y a quien lo retira después.")+FLOW(["Segregar","Descontaminar","Mantener"])+UL(["Separa los cortopunzantes en contenedor rígido y el resto según el plan de residuos del centro y la normativa autonómica: no todos los residuos de una clínica tienen la misma clasificación.","Cierra los recipientes en su límite de llenado, sin comprimir bolsas ni trasvasar puntas.","Mantén identificados el almacenamiento y la recogida.","Los productos químicos no se vierten al desagüe sin autorización.","Separa los restos de amalgama o mercurio, si existen, mediante el circuito específico; <b>no uses aspirador doméstico</b> ante un derrame de mercurio."])],
["2. Limpieza de superficies y derrames",UL(["Sigue la secuencia y el producto validados, respetando dosis y tiempo de contacto.","Atiende especialmente mandos, bandejas, lámparas y zonas de contacto frecuente.","Ante un derrame biológico: delimita, usa los EPI previstos y recoge con material adecuado.","Los fragmentos se retiran con pinzas o útiles, <b>nunca con la mano</b>."])],
["3. Agua y aspiración",UL(["Cumple el mantenimiento, tratamiento y controles del sistema de agua y aspiración.","Un depósito independiente no garantiza por sí solo que el agua sea segura.","La purga aislada no sustituye la gestión del biofilm.","Si hay fallos o resultados no conformes, aplica el procedimiento de inmovilización y corrección."])]],
key:"Separa los residuos en el origen según el plan del centro, cierra los recipientes en su límite y no viertas químicos al desagüe. Recoge los fragmentos con pinzas, nunca con la mano. El agua de la unidad necesita mantenimiento y control del biofilm, no solo purgas.",
q:[["¿Cómo se recogen los fragmentos de un derrame biológico?",["Con pinzas o útiles, nunca con la mano","Con la mano enguantada","Con un aspirador doméstico","Con una escoba y sin EPI"],0],
["Ante un derrame de mercurio:",["No se usa aspirador doméstico y se sigue el circuito específico","Se aspira con el aspirador de la clínica","Se barre y se tira a la basura","Se vierte al desagüe"],0],
["Los productos químicos sobrantes:",["No se vierten al desagüe sin autorización","Se vierten siempre al lavabo","Se mezclan para neutralizarlos","Se tiran con los residuos generales"],0],
["Las bolsas y recipientes de residuos:",["Se cierran en su límite de llenado, sin comprimir","Se comprimen para que quepa más","Se llenan hasta rebosar","Se trasvasan a otras bolsas"],0],
["Respecto al agua de la unidad dental:",["La purga aislada no sustituye la gestión del biofilm","Un depósito independiente garantiza que el agua es segura","No necesita mantenimiento","Basta con cambiarla una vez al año"],0]]}
]};
const M5={t:"Equipos de protección individual (EPI)",fmin:3,s:"Qué EPI necesitas en cada tarea, cómo comprobarlo y la secuencia de colocación y, sobre todo, de retirada segura.",L:[
{t:"Qué EPI necesitas en cada tarea",ico:"🥽",min:7,src:"RD 773/1997; CDC, precauciones estándar; fichas de datos de seguridad",
obj:["Elegir el EPI según la exposición real de cada tarea.","Saber que el guante sanitario no protege frente a todos los químicos.","Comprobar el EPI antes de usarlo."],
b:[["1. Atención y procedimientos con salpicaduras",FIGI("assets/l41-epi.webp","Higienista con guantes, mascarilla, gafas, pantalla y bata","El EPI se elige por la exposición real y debe ser compatible con los demás elementos.")+UL(["Guantes sanitarios adecuados a la tarea, protección ocular frente a proyecciones, protección de nariz y boca y ropa de protección cuando exista riesgo de contaminación.","<b>Guantes nuevos para cada paciente</b>; sustitúyelos si se rompen o contaminan.","No laves ni reutilices los guantes de un solo uso."])],
["2. Aerosoles y reprocesado",UL(["Si existe necesidad de protección respiratoria: <b>FFP2/FFP3</b> definida en la evaluación, con ajuste correcto.","La pantalla es una barrera adicional frente a salpicaduras.","Limpieza de instrumental: guantes resistentes compatibles con riesgo mecánico, biológico y químico; gafas o pantalla y protección corporal según la tarea."])],
["3. Productos y riesgos especiales",UL(["Para químicos, selecciona el material del guante y su tiempo de uso por la <b>ficha de datos de seguridad (FDS)</b>: un guante de nitrilo sanitario no protege frente a todos los productos.","Para calor o radiación óptica, utiliza protección específica cuando la tarea lo exija.","El uniforme corriente <b>no es por sí mismo un EPI</b>."])+NOTE("<b>Comprobación:</b> talla, integridad, marcado aplicable, instrucciones, ajuste y compatibilidad. La empresa facilita y repone la protección necesaria <b>sin coste</b> para ti.")]],
key:"Guantes nuevos para cada paciente, protección ocular, de nariz y boca y ropa de protección según la exposición; FFP2/FFP3 si la evaluación lo exige. Para químicos, el guante se elige por la FDS. El uniforme no es un EPI. La empresa facilita y repone los EPI sin coste.",
q:[["Los guantes de un solo uso:",["Se cambian para cada paciente y no se lavan ni reutilizan","Se lavan entre pacientes","Se usan toda la mañana","Se desinfectan con alcohol y se reutilizan"],0],
["Para elegir el guante frente a un producto químico consultas:",["La ficha de datos de seguridad del producto","El color del envase","La opinión de un compañero","Nada: el nitrilo sanitario protege de todo"],0],
["El uniforme corriente de trabajo:",["No es por sí mismo un EPI","Es un EPI frente a todos los riesgos","Sustituye la bata de protección","Protege frente a salpicaduras químicas"],0],
["¿Quién paga los EPI necesarios?",["La empresa, sin coste para el trabajador","El trabajador","A medias","El paciente"],0],
["Para limpiar instrumental se necesitan guantes:",["Resistentes y compatibles con riesgo mecánico, biológico y químico","Finos de vinilo","Ninguno","De lana"],0]]},
{t:"Ponerse y retirarse la protección",ico:"🧤",min:7,src:"RD 773/1997; CDC, secuencia de colocación y retirada de EPI",
obj:["Seguir una secuencia orientativa de colocación.","Retirar el EPI sin contaminarte.","Desechar, limpiar y reponer correctamente."],
b:[["1. Colocación: una secuencia orientativa",FIGI("assets/l42-poner-retirar.webp","Secuencia de colocación del equipo de protección","La retirada es un momento crítico: evita que las superficies contaminadas contacten con piel o ropa.")+FLOW(["1 Manos","2 Ropa","3 Respirador","4 Ojos","5 Guantes"])+UL(["Prepara el material y realiza higiene de manos.","Coloca bata o ropa protectora; después mascarilla o respirador, protección ocular y guantes cubriendo el puño si corresponde.","La selección del modelo debe incluir la comprobación de su ajuste a tu cara. <b>Comprueba el sellado cada vez</b> que lo uses.","La barba en la zona de sellado puede impedir la protección: precisa una solución adecuada."])],
["2. Retirada: controlar lo que tocas",UL(["En la zona prevista, retira los guantes sin tocar su exterior con la mano desnuda, y la bata evitando sacudirla; higieniza cuando proceda.","Retira gafas o pantalla por las patillas o la banda.","Retira la mascarilla por sus bandas, sin tocar el frontal y fuera de la exposición respiratoria.","Termina con <b>higiene de manos</b>."])],
["3. Desechar, limpiar y reponer",UL(["Desecha lo de un solo uso en el circuito correcto.","Reprocesa el EPI reutilizable según el fabricante; guárdalo limpio y seco.","Sustituye la protección húmeda, sucia, deteriorada o con pérdida de ajuste.","No la lleves bajo la barbilla ni la guardes suelta en un bolsillo."])+NOTE("Adapta la secuencia de retirada a los EPI concretos y al procedimiento de tu centro, y practícala con supervisión.")]],
key:"Colocación orientativa: manos, ropa, respirador, ojos y guantes, comprobando el sellado cada vez. Retirada en la zona prevista, sin tocar el exterior, gafas y mascarilla por las bandas, y siempre higiene de manos al final. Sustituye lo húmedo, sucio o deteriorado.",
q:[["¿Cuál es el último paso de la retirada del EPI?",["La higiene de manos","Quitarse la bata sacudiéndola","Tocar el frontal de la mascarilla","Guardar la mascarilla en el bolsillo"],0],
["La mascarilla o el respirador se retiran:",["Por las bandas, sin tocar el frontal","Tirando del frontal","Bajándolos a la barbilla","Con los guantes contaminados por delante"],0],
["El sellado del respirador se comprueba:",["Cada vez que se usa","Solo el primer día","Nunca","Una vez al año"],0],
["La barba en la zona de sellado del respirador:",["Puede impedir la protección y precisa una solución adecuada","No influye en el ajuste","Mejora el sellado","Solo importa en mascarillas quirúrgicas"],0],
["Una mascarilla húmeda o deteriorada:",["Se sustituye","Se seca y se sigue usando","Se lleva bajo la barbilla","Se guarda en el bolsillo para después"],0]]}
]};
const M6={t:"Productos químicos, alergias y dermatitis",fmin:3,s:"Cómo reconocer y controlar los productos químicos de la clínica, las exposiciones especiales y los vertidos, y cómo prevenir las alergias y la dermatitis.",L:[
{t:"Productos químicos: reconocer y controlar",ico:"🧪",min:8,src:"RD 374/2001; INSST, riesgo químico; fichas de datos de seguridad",
obj:["Identificar el producto a través de la etiqueta y la ficha de datos de seguridad.","Preparar y usar los productos sin improvisar.","Actuar ante exposiciones especiales y vertidos."],
b:[["1. Saber qué producto utilizas",FIGI("assets/l51-quimicos.webp","Higienista leyendo la etiqueta de un producto desinfectante","Desinfectantes, detergentes y materiales dentales pueden irritar, quemar o sensibilizar.")+FLOW(["Leer etiqueta","Dosificar","Ventilar","Proteger"])+UL(["Identifica nombre, uso y pictogramas.","Lee la etiqueta y la <b>ficha de datos de seguridad (FDS)</b>: peligros, primeros auxilios, manipulación, EPI y vertidos.","Entre los productos posibles están hipocloritos, alcoholes, peróxidos, ácidos, adhesivos y resinas.","Los aldehídos o agentes de mayor peligrosidad requieren especial valoración y <b>sustitución</b> cuando sea viable."])],
["2. Preparar y usar sin improvisar",UL(["Respeta concentración, tiempo de contacto y compatibilidad.","Utiliza sistemas de dosificación y recipientes identificados. <b>No trasvases a botellas de bebida.</b>","Mantén los envases cerrados y la ventilación prevista.","Evita pulverizar si existe una alternativa validada con menor dispersión."])+ALERT("No mezcles <b>lejía</b> con ácidos, amoniaco ni otros limpiadores.")],
["3. Exposiciones especiales y vertidos",UL(["Si hay sedación con <b>óxido nitroso</b>: extracción de gases residuales, control de fugas, ventilación y evaluación de la exposición. <b>Una FFP2 no protege frente a gases.</b>","En trabajos con polvo, controla su generación y captación.","Separa incompatibles y limita las cantidades. Mantén los inflamables lejos del calor y de fuentes de ignición.","Ante un vertido desconocido, importante o con vapores: <b>aísla, aléjate y avisa</b>. Solo el personal formado limpiará derrames controlables con el kit y los EPI definidos."])]],
key:"Lee la etiqueta y la FDS antes de usar un producto. Respeta concentración y tiempo, usa recipientes identificados y nunca botellas de bebida. No mezcles lejía con ácidos ni amoniaco. Una FFP2 no protege frente a gases. Ante un vertido importante, aísla, aléjate y avisa.",
q:[["¿Dónde encuentras los peligros, EPI y actuación ante vertidos de un producto?",["En la etiqueta y la ficha de datos de seguridad","En la factura","En la web de cualquier tienda","En ningún sitio"],0],
["Para trasvasar un desinfectante diluido:",["Se usa un recipiente identificado, nunca una botella de bebida","Se usa una botella de agua vacía","Se usa un vaso del office","Se usa cualquier envase sin etiqueta"],0],
["¿Qué no debes mezclar nunca con lejía?",["Ácidos, amoniaco u otros limpiadores","Agua en la dilución indicada","Nada: se puede mezclar con todo","Solo el jabón de manos"],0],
["Frente al óxido nitroso residual, una mascarilla FFP2:",["No protege, porque es un gas","Protege totalmente","Es la medida principal","Sustituye la extracción de gases"],0],
["Ante un vertido químico desconocido con vapores:",["Aíslas la zona, te alejas y avisas","Lo limpias rápidamente con papel","Lo diluyes con lejía","Lo dejas y sigues trabajando"],0]]},
{t:"Alergias, dermatitis y exposición cutánea",ico:"🖐️",min:6,src:"INSST, exposición dérmica; RD 374/2001",
obj:["Reconocer las señales de daño en la piel y de sensibilización.","Reducir la exposición cutánea.","Actuar antes de que el problema empeore."],
b:[["1. Reconocer las señales",FIGI("assets/l52-dermatitis.webp","Cuidado de la piel de las manos y selección de guantes","La piel puede dañarse por trabajo húmedo, lavado frecuente, guantes y contacto con sustancias.")+UL(["Sequedad persistente, enrojecimiento, grietas, picor o ampollas requieren valoración.","La rinitis, la tos o la dificultad respiratoria al usar un producto también deben comunicarse.","Puede existir sensibilización a <b>látex</b>, aditivos del caucho, resinas y desinfectantes. Una alergia previa exige revisar materiales y tareas."])],
["2. Reducir la exposición",UL(["Evita el contacto directo con materiales sin polimerizar y productos concentrados.","Utiliza guantes apropiados, limpios por dentro y por fuera, y cámbialos cuando proceda.","Seca bien las manos y utiliza cuidado cutáneo compatible con el trabajo sanitario.","No uses disolventes ni productos de superficies para limpiarte la piel."])],
["3. Actuar antes de empeorar",UL(["Comunica los síntomas a vigilancia de la salud y al responsable preventivo.","Deben estudiarse alternativas de producto, guante, organización o procedimiento.","No atribuyas toda lesión a una simple sequedad ni mantengas una exposición que produzca síntomas importantes."])+ALERT("Ante dificultad respiratoria, edema o desmayo, <b>activa la asistencia urgente</b>.")+NOTE("<b>Ejemplo.</b> Si un guante produce picor repetido, cambiar solo de talla no resuelve el problema: hay que identificar la causa y seleccionar una alternativa.")]],
key:"Sequedad persistente, grietas, picor o síntomas respiratorios al usar un producto se comunican a vigilancia de la salud. Evita el contacto con materiales sin polimerizar, usa guantes adecuados y nunca disolventes en la piel. Dificultad respiratoria, edema o desmayo: asistencia urgente.",
q:[["Sufres picor repetido con un tipo de guante. ¿Qué es lo correcto?",["Comunicarlo para identificar la causa y elegir una alternativa","Cambiar solo de talla","Aguantar porque es normal","Ponerte dos guantes iguales"],0],
["Para limpiarte restos de producto de la piel:",["No uses disolventes ni productos de superficies","Usa disolvente","Usa el desinfectante de superficies","Usa lejía diluida"],0],
["Tos o dificultad respiratoria al usar un producto:",["Debe comunicarse","Es normal y no hay que decir nada","Se soluciona con una mascarilla quirúrgica","Solo importa si dura un mes"],0],
["Ante dificultad respiratoria, edema o desmayo tras una exposición:",["Se activa la asistencia urgente","Se espera a ver si mejora","Se toma un vaso de agua","Se continúa trabajando"],0]]}
]};
const M7={t:"Ergonomía clínica, cargas y pantallas",fmin:3,s:"Cómo colocar el trabajo para no forzar cuello y espalda, cómo cuidar las manos, manipular cargas, apoyar a pacientes y trabajar con el ordenador.",L:[
{t:"Ergonomía clínica: coloca el trabajo",ico:"🪑",min:7,src:"INSST, posturas de trabajo y prevención de trastornos musculoesqueléticos",
obj:["Ajustar taburete, sillón y paciente antes de empezar.","Mejorar la visión y los alcances.","Cambiar de postura y pedir valoración ante síntomas."],
b:[["1. Ajustar antes de empezar",FIGI("assets/l61-ergonomia.webp","Higienista con postura neutra trabajando junto al sillón dental","Acercar el campo de trabajo y ajustar la visión evita compensar con el cuello y la espalda.")+UL(["Regula taburete, apoyo lumbar y sillón del paciente.","Busca pies apoyados, caderas y rodillas cómodas y hombros relajados.","Acerca el campo clínico para trabajar sin inclinar o girar el tronco de forma mantenida.","Adapta la posición del paciente y la tuya a la zona de la boca."])],
["2. Mejorar la visión y los alcances",UL(["Orienta la lámpara para evitar sombras y deslumbramientos.","Utiliza visión indirecta y lupas ajustadas cuando sean adecuadas.","Coloca bandeja, aspiración y útiles frecuentes cerca, con los codos próximos al cuerpo.","Evita mantener los brazos elevados o las muñecas desviadas."])],
["3. Cambiar de postura",UL(["Alterna tareas y posiciones cuando sea posible.","Aprovecha los cambios de paciente para levantarte y realizar movimientos suaves sin dolor.","Si hay hormigueo, pérdida de fuerza, dolor nocturno o molestias persistentes, <b>solicita valoración</b>."])+NOTE("La ergonomía se corrige con <b>diseño y organización</b>, además de con hábitos.")]],
key:"Ajusta taburete, apoyo lumbar y sillón antes de empezar y acerca el campo clínico: es el paciente quien se coloca, no tu espalda la que se dobla. Útiles cerca, codos junto al cuerpo, luz sin sombras. Alterna posturas y pide valoración ante hormigueo o dolor persistente.",
q:[["Para no forzar el cuello y la espalda debes:",["Acercar el campo clínico y ajustar sillón y taburete","Inclinar el tronco hacia el paciente toda la sesión","Trabajar con los brazos elevados","Girar el tronco de forma mantenida"],0],
["La bandeja, la aspiración y los útiles frecuentes se colocan:",["Cerca, con los codos próximos al cuerpo","Lo más lejos posible","Detrás de la espalda","En el suelo"],0],
["Si notas hormigueo, pérdida de fuerza o dolor nocturno:",["Solicitas valoración","Lo ignoras","Aumentas la fuerza de agarre","Trabajas más deprisa"],0],
["Los cambios entre pacientes pueden aprovecharse para:",["Levantarte y hacer movimientos suaves","Mantener la misma postura","Saltarte la pausa","Cargar cajas pesadas"],0]]},
{t:"Manos, cargas y pantallas",ico:"📦",min:7,src:"RD 487/1997; RD 488/1997; INSST, ergonomía y carga física",
obj:["Reducir la fuerza de pinza y los movimientos repetitivos.","Manipular cargas y apoyar a pacientes con seguridad.","Trabajar con el ordenador de forma saludable e higiénica."],
b:[["1. Movimientos repetitivos y fuerza de pinza",FIGI("assets/l62-manos-cargas.webp","Uso de carro para transportar cajas y trabajo en ordenador","Las pequeñas exigencias repetidas pueden acumularse durante toda la jornada.")+UL(["Usa instrumental con empuñadura y tamaño adecuados, en buen estado y con el mantenimiento recomendado: una punta ineficaz puede aumentar la fuerza necesaria.","Evita apretar más de lo necesario y mantén la muñeca alineada.","Alterna tareas de distinta demanda y programa recuperación suficiente."])],
["2. Cajas, bidones y apoyo a pacientes",UL(["Reduce el peso de las unidades, utiliza carros y guarda lo frecuente a una altura accesible.","Acerca la carga al cuerpo y gira moviendo los pies.","<b>No levantes en solitario</b> a un paciente que precisa transferencia asistida: valora su autonomía y utiliza ayuda humana o técnica según el procedimiento.","No hay un peso máximo único válido para todas las situaciones."])],
["3. Registro y trabajo con ordenador",UL(["Sitúa la pantalla de frente, sin reflejos, y el teclado y el ratón próximos.","Apoya la espalda y permite el apoyo de los pies.","Alterna mirada cercana y lejana, parpadea y cambia de actividad.","Mantén teclado y ratón limpios; separa la manipulación clínica del registro con manos higienizadas."])+NOTE("<b>Medida organizativa.</b> No concentres todas las tareas de mayor esfuerzo o repetición sin recuperación. Revisa agenda, tiempos y distribución del material.")]],
key:"Instrumental en buen estado y muñeca alineada reducen la fuerza de pinza. Usa carros, acerca la carga al cuerpo y gira con los pies; nunca levantes sola a un paciente que necesita transferencia asistida. Pantalla de frente sin reflejos y teclado limpio, tocado con manos higienizadas.",
q:[["Un instrumento con la punta desgastada:",["Puede aumentar la fuerza necesaria y debe mantenerse o sustituirse","Es más seguro","Reduce la fuerza de pinza","No influye en nada"],0],
["Al girar con una carga en las manos debes:",["Mover los pies en lugar de girar el tronco","Girar la cintura bruscamente","Alejar la carga del cuerpo","Doblar la espalda"],0],
["Un paciente necesita ayuda para pasar al sillón con transferencia asistida:",["No lo levantas en solitario; usas ayuda humana o técnica","Lo levantas tú sola rápidamente","Le pides que se las arregle","Tiras de sus brazos"],0],
["Respecto al peso máximo que se puede manipular:",["No hay un valor único válido para todas las situaciones","Siempre es de 50 kg","No hay ningún límite","Solo importa si es un bidón"],0],
["Antes de usar el teclado tras atender al paciente:",["Te retiras los guantes y te higienizas las manos","Lo usas con los guantes contaminados","Lo limpias con la bata","Da igual"],0]]}
]};
const M8={t:"Agentes físicos y protección radiológica",fmin:3,s:"Ruido y vibraciones de los equipos, radiaciones ópticas (lámpara de polimerizar y láser), iluminación y ambiente, y protección frente a los rayos X.",L:[
{t:"Ruido, vibraciones, luz y ambiente",ico:"🔊",min:7,src:"RD 286/2006; RD 1311/2005; RD 486/2010; RD 486/1997",
obj:["Detectar ruido y vibraciones anómalos en los equipos.","Protegerse de la lámpara de polimerización y del láser.","Mantener una iluminación y un ambiente térmico adecuados."],
b:[["1. Ruido y vibración de equipos",FIGI("assets/l71-fisicos.webp","Higienista con gafas filtrantes usando la lámpara de polimerización","El mantenimiento y la elección del equipo condicionan tanto el confort como la exposición.")+FLOW(["Ruido","Vibración","Luz / láser","Ambiente"])+UL(["Turbinas, ultrasonidos, aspiración y compresores pueden generar ruido.","Informa de cambios de sonido, vibración anormal o averías y retira el equipo si procede.","Mantén equipos y puntas según el fabricante.","La evaluación determinará si son necesarias mediciones y medidas específicas: no se presume un nivel seguro por tratarse de una clínica."])],
["2. Radiaciones ópticas artificiales",UL(["<b>No mires directamente</b> la lámpara de fotopolimerización. Usa filtros o protección ocular compatibles con su emisión y el equipo.","Si existe <b>láser</b>, solo personal formado y autorizado: zona controlada, señalización y gafas seleccionadas para la longitud de onda y la protección requerida."])+ALERT("Las <b>gafas de sol no sirven</b> como protección frente al láser ni a la lámpara de polimerizar.")],
["3. Iluminación y ambiente térmico",UL(["Ajusta la luz general y la de trabajo para evitar sombras, reflejos y forzar la visión.","Limpia y conserva las luminarias con seguridad.","Comunica calor, frío, corrientes o ventilación insuficiente.","No bloquees salidas de aire ni realices cambios improvisados en los sistemas."])]],
key:"Comunica ruidos o vibraciones anómalos y mantén los equipos según fabricante. No mires la lámpara de polimerizar y usa filtros o gafas compatibles; el láser es solo para personal formado, con gafas para su longitud de onda (las de sol no sirven). Comunica problemas de luz, temperatura o ventilación.",
q:[["Con la lámpara de fotopolimerización:",["No la miras directamente y usas filtro o protección compatible","La miras para comprobar que funciona","Usas gafas de sol","No hace falta protección"],0],
["Las gafas para trabajar con láser:",["Se seleccionan para su longitud de onda y protección requerida","Pueden ser gafas de sol","Son las gafas graduadas","No son necesarias"],0],
["Si una pieza de mano empieza a vibrar de forma anormal:",["Informas y la retiras si procede","Sigues usándola","La desmontas tú","Aprietas más fuerte"],0],
["Respecto al ruido en la clínica:",["La evaluación determina si hacen falta mediciones; no se presume seguro","Nunca hay ruido en una clínica","Siempre es peligroso","Solo importa el de la calle"],0]]},
{t:"Rayos X: protección radiológica",ico:"☢️",min:7,src:"RD 1029/2022; RD 1085/2009; CSN, acreditaciones de radiodiagnóstico",
obj:["Conocer quién puede operar los equipos de rayos X.","Protegerse durante una exposición.","Conocer la dosimetría y las situaciones especiales."],
b:[["1. Autorización y organización",FIGI("assets/l72-rayosx.webp","Disparo de un equipo de rayos X intraoral desde el puesto protegido","Este apartado se aplica si trabajas en una instalación de radiodiagnóstico dental.")+UL(["Opera únicamente con la <b>acreditación exigible</b>, formación en el equipo y autorización del centro.","Respeta el programa de protección radiológica y las instrucciones de la instalación.","No decidas por tu cuenta la indicación de una exploración ni repitas exposiciones sin el criterio clínico correspondiente."])],
["2. Durante una exposición",UL(["Utiliza el <b>puesto protegido</b> y las barreras previstas.","Controla el acceso y comprueba que nadie queda en una zona no autorizada.","No sitúes partes del cuerpo en el haz.","<b>No sujetes de forma rutinaria</b> el receptor, el cabezal ni al paciente durante la exposición. Si excepcionalmente se necesita asistencia, debe resolverse según el procedimiento radiológico."])],
["3. Seguimiento y situaciones especiales",UL(["Utiliza <b>dosimetría</b> cuando esté indicada para tu clasificación y puesto; es personal y debe colocarse y gestionarse según las instrucciones.","Comunica averías o incidencias al responsable.","Embarazo y lactancia se valoran específicamente; no implican por sí mismos una prohibición automática de todo trabajo con rayos X."])+NOTE("<b>Regla operativa.</b> Reduce la exposición mediante organización, distancia y blindaje conforme al diseño de la instalación. No improvises una distancia universal como única protección.")]],
key:"Solo opera rayos X con acreditación, formación y autorización. Dispara desde el puesto protegido, controla el acceso y no sujetes de forma rutinaria receptor, cabezal ni paciente. El dosímetro es personal. Embarazo y lactancia se valoran específicamente.",
q:[["Para operar el equipo de rayos X necesitas:",["La acreditación exigible, formación en el equipo y autorización del centro","Solo el título de higienista","Solo haber visto a otra persona hacerlo","Nada especial"],0],
["Durante la exposición:",["Te sitúas en el puesto protegido y no sujetas de forma rutinaria al paciente ni al receptor","Sujetas el receptor dentro de la boca del paciente","Te quedas junto al cabezal","Sujetas al paciente para que no se mueva"],0],
["El dosímetro personal:",["Es personal y se usa según las instrucciones","Se puede prestar a un compañero","Se deja siempre junto al equipo","No sirve para nada"],0],
["Respecto al embarazo y los rayos X:",["Se valora específicamente; no implica por sí mismo una prohibición automática","Prohíbe automáticamente cualquier trabajo en la clínica","No hay que comunicarlo","No influye en nada"],0],
["¿Puedes repetir una radiografía por tu cuenta?",["No, sin el criterio clínico correspondiente","Sí, siempre que quieras","Sí, si el paciente no protesta","Sí, porque la dosis es nula"],0]]}
]};
const M9={t:"Seguridad en el gabinete: caídas, golpes y equipos",fmin:3,s:"Caídas, golpes, atrapamientos y proyecciones, y el uso seguro de equipos eléctricos, autoclave, aire comprimido y gases.",L:[
{t:"Caídas, golpes y proyecciones",ico:"⚠️",min:6,src:"RD 486/1997; RD 1215/1997",
obj:["Mantener los pasos libres y prevenir caídas.","Evitar golpes, atrapamientos y caídas de objetos.","Protegerse de partículas y salpicaduras."],
b:[["1. Caídas al mismo y distinto nivel",FIGI("assets/l81-caidas.webp","Gabinete ordenado con pasos libres y escalera adecuada para armarios altos","Un gabinete ordenado reduce accidentes y facilita salir rápidamente si aparece una emergencia.")+FLOW(["Paso libre","Orden estable","Protección ocular"])+UL(["Mantén los pasos libres de cables, mangueras, cajas y bolsas.","Retira los derrames de inmediato con el procedimiento seguro y señaliza mientras exista riesgo.","Utiliza calzado estable, cerrado y con suela adecuada al suelo.","Para alcanzar armarios altos emplea una <b>escalera apropiada y revisada</b>; no subas a taburetes con ruedas ni a sillas."])],
["2. Golpes, atrapamientos y caída de objetos",UL(["Guarda el material pesado en niveles bajos o intermedios y sin sobrecargar las baldas.","Cierra los cajones y evita salientes en zonas de paso.","Antes de mover el sillón, comprueba manos, piernas, cables y objetos en su recorrido. Mantén despejada la zona de los mecanismos."])],
["3. Partículas y salpicaduras",UL(["Usa protección ocular adecuada al procedimiento.","Revisa puntas y accesorios y confirma su fijación antes del uso.","No dirijas chorros de aire o agua hacia otras personas.","Retira los instrumentos de forma controlada para evitar golpes con bordes y puntas."])]],
key:"Pasos libres de cables y cajas, derrames recogidos y señalizados, calzado cerrado y estable y escalera revisada (nunca taburetes con ruedas). Material pesado abajo y cajones cerrados. Antes de mover el sillón, comprueba su recorrido. Protección ocular y puntas bien fijadas.",
q:[["Para coger material de un armario alto usas:",["Una escalera apropiada y revisada","El taburete con ruedas","Una silla","El sillón dental"],0],
["El material pesado se guarda:",["En niveles bajos o intermedios","En la balda más alta","En el suelo de la zona de paso","Encima de los armarios"],0],
["Antes de mover el sillón dental:",["Compruebas que no hay manos, piernas, cables ni objetos en su recorrido","Lo mueves sin mirar","Avisas solo al final","Pides al paciente que se agarre al mecanismo"],0],
["Ante un derrame en el suelo:",["Lo retiras de inmediato y señalizas mientras haya riesgo","Lo dejas para el personal de limpieza del día siguiente","Pones papel encima y sigues","Lo saltas"],0]]},
{t:"Equipos: electricidad, calor y presión",ico:"🔌",min:7,src:"RD 1215/1997; RD 614/2001; instrucciones de autoclaves, compresores y gases",
obj:["Detectar anomalías eléctricas y no usar equipos inseguros.","Usar el autoclave y manipular superficies calientes con seguridad.","Trabajar con aire comprimido, botellas y gases."],
